<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Арифметика ДОФА</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Блочный мир: пиксельные панели «инвентаря» поверх параллакс-пейзажа из блоков (день/ночь) */
:root{
 --font-px:"Press Start 2P","Nunito",system-ui,sans-serif;
 --font-body:"Nunito",system-ui,"Segoe UI",sans-serif;
 --ink:#232323;--muted:#4a4a4a;
 --panel:#c6c6c6;--panel-hi:#fbfbfb;--panel-lo:#5a5a5a;--edge:#121212;
 --slot:#8b8b8b;--slot-hi:#ffffff;--slot-lo:#373737;
 --btn:#9a9a9a;--btn-hi:#d4d4d4;--btn-lo:#4a4a4a;
 --pri:#4f9a2c;--pri-hi:#8bd451;--pri-lo:#2b5a16;
 --red:#c43a3a;--red-hi:#f07a7a;--red-lo:#6e1818;
 --gold:#ffd23f;--ok:#3da52a;--bad:#cf3434;--xp:#80e026;
 --toast:#212121;--sign:#b58a55;--sign-hi:#d6ac73;--sign-lo:#6d4f2b;
 color-scheme:light;
}
body.dark{
 --ink:#ededf3;--muted:#b4b4c6;
 --panel:#34343e;--panel-hi:#5e5e6c;--panel-lo:#121216;--edge:#000;
 --slot:#22222a;--slot-hi:#4c4c58;--slot-lo:#09090c;
 --btn:#4a4a56;--btn-hi:#757584;--btn-lo:#1b1b21;
 --sign:#5b4630;--sign-hi:#7c6142;--sign-lo:#2c2014;
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font-body);color:var(--ink);background:#0d1430;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
#hype{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s}
#lens{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:radial-gradient(circle at var(--lx,50%) var(--ly,42%),rgba(255,255,255,.09) 0,rgba(255,255,255,0) 32%,rgba(0,0,0,.30) 100%)}
body[data-lvl="2"] #hype{opacity:.5;background:radial-gradient(circle,transparent 35%,#5ab0ff 130%)}
body[data-lvl="3"] #hype{opacity:.6;background:radial-gradient(circle,transparent 30%,#ff4fa3 120%)}
body[data-lvl="4"] #hype{opacity:.32;background:linear-gradient(270deg,#7f00ff,#e100ff,#ff6a00,#7f00ff);background-size:600% 600%;animation:bgmove 4s ease infinite}
body[data-lvl="5"] #hype{opacity:.45;background:linear-gradient(270deg,#ff0040,#ff9900,#ffee00,#33ff66,#00ccff,#7a00ff,#ff00cc);background-size:800% 800%;animation:bgmove 2s linear infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#app{position:relative;z-index:2;max-width:940px;margin:0 auto;padding:16px 16px 48px;transform:perspective(1600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translate3d(var(--px,0),var(--py,0),0);transform-origin:50% 30vh}
h1,h2,h3{font-family:var(--font-px);font-weight:400;margin:.6em 0;line-height:1.35}
h2{font-size:16px}
h3{font-size:13px!important}
.on-sky{color:#fff;text-shadow:3px 3px 0 #2a2a2a}
/* ---- блоки ---- */
.blk{background:var(--panel);box-shadow:inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo),0 0 0 3px var(--edge)}
.slotbox{background:var(--slot);box-shadow:inset 3px 3px 0 var(--slot-lo),inset -3px -3px 0 var(--slot-hi)}
.btn{font-family:var(--font-px);font-weight:400;font-size:13px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.5);padding:13px 18px;line-height:1.35;
 background:var(--btn);box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),0 0 0 3px var(--edge);transition:filter .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);filter:brightness(.95)}
.btn.pri{background:var(--pri);box-shadow:inset 3px 3px 0 var(--pri-hi),inset -3px -3px 0 var(--pri-lo),0 0 0 3px var(--edge)}
.btn.danger{background:var(--red);box-shadow:inset 3px 3px 0 var(--red-hi),inset -3px -3px 0 var(--red-lo),0 0 0 3px var(--edge)}
.btn.big{font-size:15px;padding:16px 24px}
.btn.sm{font-size:11px;padding:10px 12px}
.icon{font-size:22px;width:46px;height:46px;display:grid;place-items:center;background:var(--btn);box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),0 0 0 3px var(--edge)}
.icon:hover{filter:brightness(1.12)}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:22px 0}
.sp{flex:1}
.muted{color:var(--muted)}
/* ---- логотип ---- */
.logo-wrap{position:relative;text-align:center;margin:14px 0 4px}
.logo{font-family:var(--font-px);font-weight:700;font-size:clamp(26px,6.4vw,58px);line-height:1.15;margin:0;color:#e9e9e9;
 text-shadow:3px 3px 0 #8a8a8a,6px 6px 0 #3a3a3a,9px 9px 0 rgba(0,0,0,.35);text-wrap:balance}
.logo span{color:var(--gold);text-shadow:3px 3px 0 #b8860b,6px 6px 0 #5c3d00,9px 9px 0 rgba(0,0,0,.35)}
.splash{display:inline-block;font-family:var(--font-px);font-weight:700;color:#ffff3c;text-shadow:2px 2px 0 #3f3f00;font-size:clamp(10px,1.8vw,14px);line-height:1.5;max-width:90%;
 transform:rotate(-8deg);animation:splash .9s ease-in-out infinite alternate;margin-top:14px}
@keyframes splash{to{transform:rotate(-8deg) scale(1.08)}}
.status{display:inline-block;font-weight:800;font-size:13px;padding:6px 10px;margin-top:10px;background:rgba(0,0,0,.45);color:#fff}
.topbar{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.sel{font-family:var(--font-px);font-weight:400;font-size:11px;color:#fff;background:var(--btn);border:0;padding:10px 12px;
 box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),0 0 0 3px var(--edge);max-width:100%}
.sel option{color:#000;background:#fff}
/* ---- игроки ---- */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;padding:3px}
.pcard{padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.pcard:hover{transform:translateY(-4px)}
.pcard b{font-family:var(--font-px);font-weight:400;font-size:12px;line-height:1.5;word-break:break-word}
.pcard small{color:var(--muted);font-weight:800}
.flag{font-size:1.05em}
/* ---- аватары и рамки ---- */
.frame{position:relative;padding:5px;flex:none;display:inline-block}
.frame::before{content:"";position:absolute;inset:0;background:#7d7d7d;box-shadow:inset 2px 2px 0 rgba(255,255,255,.45),inset -2px -2px 0 rgba(0,0,0,.45)}
.frame .ava{position:relative;z-index:1;background:var(--slot);box-shadow:inset 2px 2px 0 var(--slot-lo);display:grid;place-items:center;width:100%;height:100%;line-height:1}
.frame.s{width:42px;height:42px;padding:4px}.frame.s .ava{font-size:22px}
.frame.m{width:72px;height:72px;padding:6px}.frame.m .ava{font-size:38px}
.frame.l{width:112px;height:112px;padding:8px}.frame.l .ava{font-size:60px}
.fr-bronze::before{background:repeating-linear-gradient(45deg,#a8582c 0 4px,#d98a52 4px 8px)}
.fr-silver::before{background:repeating-linear-gradient(45deg,#bdbdbd 0 4px,#f2f2f2 4px 8px)}
.fr-gold::before{background:repeating-linear-gradient(45deg,#d9a51a 0 4px,#fff07a 4px 8px)}.fr-gold{filter:drop-shadow(0 0 6px #ffd54f)}
.fr-neon::before{background:#2ee6d6}.fr-neon{filter:drop-shadow(0 0 7px #2ee6d6);animation:glow 1.6s ease-in-out infinite}
.fr-rainbow::before{background:linear-gradient(90deg,#ff3b3b,#ffa53b,#ffe63b,#4ee34e,#3bc4ff,#9b5bff);animation:hue 2s linear infinite}
.fr-fire::before{background:repeating-linear-gradient(0deg,#ff5a00 0 4px,#ffb000 4px 8px,#ff2a00 8px 12px);background-size:100% 24px;animation:lava 1s steps(6) infinite}.fr-fire{filter:drop-shadow(0 0 7px #ff6d00)}
.fr-cosmic::before{background:repeating-conic-gradient(#2a0f4f 0 25%,#8b3cf0 0 50%) 0 0/8px 8px;animation:hue 4s linear infinite}.fr-cosmic{filter:drop-shadow(0 0 7px #b14cff)}
.fr-diamond::before{background:repeating-linear-gradient(45deg,#3fd8d0 0 4px,#d4fffc 4px 8px)}.fr-diamond{filter:drop-shadow(0 0 8px #66ffff);animation:glow 2s ease-in-out infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes lava{to{background-position:0 -24px}}
@keyframes glow{50%{filter:drop-shadow(0 0 12px #9ffff6) brightness(1.15)}}
/* ---- шапка ---- */
.top{display:flex;align-items:center;gap:12px;padding:10px 12px;flex-wrap:wrap;margin:3px}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-family:var(--font-px);font-weight:400;font-size:14px;line-height:1.5;word-break:break-word}
.dopa{font-family:var(--font-px);font-weight:400;color:#c86a00;font-size:14px;display:inline-block}
body.dark .dopa{color:var(--gold)}
.dopa.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5)}}
/* ---- режимы ---- */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:3px}
.mode{--c:#7c4dff;padding:14px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode .mi{grid-row:span 2;font-size:30px;width:58px;height:58px;display:grid;place-items:center}
.mode b{font-family:var(--font-px);font-weight:400;font-size:12px;line-height:1.5}
.mode small{color:var(--muted);font-weight:800}
.xp{grid-column:1/-1;height:14px;background:#1b1b1b;box-shadow:0 0 0 2px var(--edge);margin-top:8px;overflow:hidden}
.xp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c) 0 12px,color-mix(in srgb,var(--c) 65%,#000) 12px 14px)}
.mode .pts{grid-column:1/-1;font-family:var(--font-px);font-size:9px;line-height:1.6;color:var(--muted)}
.mode.locked{filter:grayscale(1) brightness(.85);cursor:not-allowed}
/* ---- игра ---- */
.gtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gtitle{font-family:var(--font-px);font-weight:400;font-size:13px;line-height:1.5;min-width:0}
.ginfo{display:flex;justify-content:space-between;font-family:var(--font-px);font-weight:400;font-size:11px;line-height:1.6;margin:14px 2px 6px;gap:10px;flex-wrap:wrap}
.meter{position:relative;height:26px;background:#1b1b1b;box-shadow:0 0 0 3px var(--edge);overflow:hidden;margin:0 3px}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,#ffe600 0 14px,#ff9100 14px 28px,#ff1744 28px 42px,#d500f9 42px 56px);transition:width .3s}
.meter span{position:relative;display:block;text-align:center;font-family:var(--font-px);font-weight:400;font-size:10px;line-height:26px;color:#fff;text-shadow:2px 2px 0 #000}
.timer{height:10px;background:#1b1b1b;margin:10px 3px 0;overflow:hidden;box-shadow:0 0 0 2px var(--edge)}
.timer i{display:block;height:100%;width:100%;background:var(--bad)}
.arena{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;margin:18px 3px}
.qbox{padding:26px 14px 16px;text-align:center;transition:box-shadow .4s}
body[data-lvl="3"] .qbox{box-shadow:inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo),0 0 0 3px var(--edge),0 0 24px #ff4081}
body[data-lvl="4"] .qbox,body[data-lvl="5"] .qbox{box-shadow:inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo),0 0 0 3px var(--edge),0 0 40px #fff,0 0 70px #ffee00}
.q{font-family:var(--font-px);font-weight:400;font-size:clamp(24px,6.4vw,52px);line-height:1.5;white-space:nowrap;overflow-x:auto}
.q.long{font-family:var(--font-body);font-weight:800;font-size:clamp(19px,4.2vw,26px);white-space:normal;text-align:left;line-height:1.45;letter-spacing:0;padding:0 8px;max-width:62ch;margin:0 auto}
.q.long .ansline{font-family:var(--font-px);text-align:center;font-size:clamp(20px,5vw,34px);line-height:1.6;margin-top:12px}
.slot{display:inline-block;min-width:1.6em;padding:0 .2em;color:#fff;text-shadow:3px 3px 0 #3a3a3a;background:var(--slot);box-shadow:inset 4px 4px 0 var(--slot-lo),inset -4px -4px 0 var(--slot-hi)}
.slot.ok{background:#2f8f22;box-shadow:inset 4px 4px 0 #1b5a12,inset -4px -4px 0 #7fe061;animation:pop .4s}
.slot.bad{background:#b53030;box-shadow:inset 4px 4px 0 #641515,inset -4px -4px 0 #f08080}
.slot s{color:#ffd0d0;font-size:.6em}
.fb{min-height:30px;font-family:var(--font-px);font-size:14px;font-weight:400;line-height:1.6;margin-top:14px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.tblrow{text-align:center;margin:0 0 18px}
.work{display:flex;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;flex:1 1 300px;padding:3px}
.pad button{font-family:var(--font-px);font-size:24px;height:66px}
.pad .okb{background:var(--pri);box-shadow:inset 3px 3px 0 var(--pri-hi),inset -3px -3px 0 var(--pri-lo),0 0 0 3px var(--edge)}
.pad .del{background:var(--red);box-shadow:inset 3px 3px 0 var(--red-hi),inset -3px -3px 0 var(--red-lo),0 0 0 3px var(--edge)}
.cmppad button{height:96px;font-size:40px}
.chpad{grid-template-columns:repeat(5,1fr);max-width:600px;flex-basis:100%}
.chpad button{height:80px;font-size:clamp(16px,4.6vw,26px);padding:0}
.tblrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.frow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:10px 3px;color:#fff;text-shadow:1px 1px 0 #000;flex-wrap:wrap}
.frn{font-family:var(--font-px);font-weight:400;font-size:12px;line-height:1.5;word-break:break-word}
.dot{width:12px;height:12px;flex:none;display:inline-block;background:#8a8a8a;box-shadow:0 0 0 2px #000}
.dot.on{background:#46e83f;box-shadow:0 0 0 2px #000,0 0 8px #46e83f}
.badge{display:inline-block;background:#e33;color:#fff;font-family:var(--font-px);font-size:10px;padding:3px 6px;box-shadow:0 0 0 2px #000;text-shadow:none}
.chathead{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px}
.chat{height:38vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px;text-align:left;margin:3px}
.msg{max-width:82%;align-self:flex-start;padding:8px 10px;font-weight:800;color:#fff;background:#4c4c5a;box-shadow:0 0 0 2px #000;word-break:break-word}
.msg.me{align-self:flex-end;background:#3a8a28}
.msg small{display:block;font-size:10px;opacity:.75;margin-top:2px}
.phr{display:flex;flex-wrap:wrap;gap:10px;margin:14px 3px 6px;max-height:24vh;overflow-y:auto;padding:3px;justify-content:center}
.phr .btn{font-size:10px;padding:8px 9px}
.phr.emo .btn{font-size:20px;padding:6px 8px}
.mjwrap{position:fixed;inset:0;z-index:85;background:rgba(8,10,26,.86);display:flex;flex-direction:column;align-items:center;padding:12px 8px 24px;overflow:auto}
.mjbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin:6px 0 10px}
.mjboard{position:relative;flex:none;margin:8px auto}
.mjt{position:absolute;display:grid;place-items:center;padding:0;line-height:1;background:#f3ead2;border-radius:3px;
 box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #b9a47a,3px 4px 0 #6b5a3a,4px 6px 0 rgba(0,0,0,.35);transition:transform .1s}
.mjt.blocked{filter:brightness(.62) saturate(.7)}
.mjt.sel{background:#ffe066;outline:3px solid #ff9100;transform:translateY(-3px)}
.mjt.hint{animation:mjh .5s ease-in-out infinite alternate}
@keyframes mjh{to{background:#a8ffb5;transform:translateY(-4px)}}
.kidq{font-size:clamp(26px,7vw,40px);line-height:1.35;margin:10px 0 14px;word-break:break-word;letter-spacing:2px}
.kidgrp{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.kgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.kgrid .btn{min-width:72px;font-size:22px;padding:14px 16px}
.kgrid .btn.emo{font-size:34px;padding:10px 14px}
.kgrid .btn.grp{font-size:24px;max-width:46%;padding:12px;line-height:1.25}
.kgrid .btn.right{background:#3a8a28}
.kgrid .btn.bad{background:#a32a2a}
.kprog{display:flex;gap:6px;justify-content:center;margin:6px 0 4px;flex-wrap:wrap}
.kprog i{width:16px;height:16px;background:#555;box-shadow:0 0 0 2px #000}
.kprog i.ok{background:#46e83f}.kprog i.no{background:#e33}.kprog i.now{background:#ffd23f}
.mgpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.mgpick .btn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;padding:14px 8px}
.mgpick .btn span{font-size:34px;line-height:1}
.mz{display:grid;margin:8px auto;background:#2b2b38;box-shadow:0 0 0 4px #000;touch-action:none;flex:none}
.mzc{position:relative;box-sizing:border-box;display:grid;place-items:center;line-height:1;background:#e9dfc0}
.mzc.n{border-top:3px solid #3b2a14}.mzc.s{border-bottom:3px solid #3b2a14}.mzc.w{border-left:3px solid #3b2a14}.mzc.e{border-right:3px solid #3b2a14}
.mzc.seen{background:#c8f0b8}
.mzpad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin-top:10px}
.mzpad .btn{font-size:22px;padding:10px 0}
.mem{display:grid;gap:10px;margin:10px auto;flex:none}
.memc{aspect-ratio:3/4;display:grid;place-items:center;font-size:clamp(26px,8vw,42px);padding:0;line-height:1}
.memc.hid{color:transparent;text-shadow:none}
.memc.hid::after{content:'❓';color:#fff;font-size:.7em;text-shadow:2px 2px 0 #000}
.memc.got{background:#3a8a28;opacity:.75}
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px auto;flex:none}
.pzt{aspect-ratio:1;font-size:clamp(28px,9vw,44px);padding:0;display:grid;place-items:center}
.pzt.empty{visibility:hidden}
.pzt.home{background:#3a8a28}
.mpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.mpgrid .btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;font-size:11px}
.mpgrid .btn span{font-size:36px;line-height:1}
.mpgrid .btn small{font-family:inherit;font-size:9px;opacity:.85}
.mpq{font-family:var(--font-px);font-size:clamp(24px,7vw,40px);margin:12px 0;color:#fff;text-shadow:3px 3px 0 #000}
.mpbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:800;color:#fff;text-shadow:1px 1px 0 #000;text-align:left}
.mpbar .tr{flex:1;height:14px;background:#333;box-shadow:0 0 0 2px #000;position:relative}
.mpbar .tr i{position:absolute;left:0;top:0;bottom:0;background:#46e83f}
.mpbar.me .tr i{background:#ffd23f}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(300px,80vw);margin:12px auto}
.ttt .btn{aspect-ratio:1;font-size:clamp(30px,10vw,52px);padding:0;display:grid;place-items:center}
.ttt .btn.wl{background:#3a8a28}
.mpmem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(380px,90vw);margin:12px auto}
.mpmem .btn{aspect-ratio:3/4;font-size:clamp(24px,8vw,40px);padding:0;display:grid;place-items:center;line-height:1}

 if(k==='del')G.input=G.input.slice(0,-1);else if(G.input.length<3)G.input=(G.input==='0'?'':G.input)+k;
 sndTick();drawSlot()}
function startTimer(){clearInterval(timerId);const T=12000,t0=Date.now(),el=document.getElementById('timer');
 timerId=setInterval(()=>{const left=Math.max(0,1-(Date.now()-t0)/T);el.style.width=left*100+'%';
  if(left<=0){clearInterval(timerId);if(!G.busy){G.busy=true;answer(false)}}},80)}
function submit(){if(!G.input)return;G.busy=true;clearInterval(timerId);answer(String(G.input)===String(G.q.a))}
function answer(ok){
 let hit100=false;const p=cur(),reg=REGULAR.includes(G.mode),st=reg?ms(p,G.mode):null,slot=document.getElementById('slot'),fb=document.getElementById('fb');
 if(ok){
  G.streak++;G.correct++;p.correct++;if(G.streak>p.bestStreak)p.bestStreak=G.streak;
  const gain=Math.min(5,1+Math.floor(G.streak/5));p.dopa+=gain;G.dopa+=gain;
  if(st){const before=st.points;st.correct++;st.points=Math.min(100,st.points+(G.streak>=10?2:1));if(before<100&&st.points>=100){hit100=true;setTimeout(moneyThrow,450)}}
  if(mgTick())G.mjOffer=true;slot.classList.add('ok');mascot(G.streak>=5?'joy':'happy');fb.textContent=pick(tl('praise'));fb.className='fb ok';
  document.getElementById('dopaVal').textContent=p.dopa;celebrate(G.streak,gain)}
 else{
  G.streak=0;G.wrong++;p.wrong++;if(st)st.wrong++;if(G.mode==='extra')G.lives--;
  slot.className='slot bad';slot.innerHTML=(G.input?`<s>${esc(G.input)}</s> `:'')+esc(G.q.a);
  fb.textContent=G.input?t('almost',{a:G.q.a}):t('timeout',{a:G.q.a});fb.className='fb bad';
  document.body.dataset.lvl=0;restartAnim(document.getElementById('qbox'),'shake');sndWrong();mascot('sad')}
 updateMeter();const un=checkUnlocks(p);save(p);announce(un);
 setTimeout(()=>{if(SCREEN!=='game')return;if(G.mode==='extra'&&G.lives<=0)endGame(true);else if(G.mjOffer){G.mjOffer=false;offerMahjong(()=>{if(SCREEN==='game')nextQ()})}else nextQ()},hit100?3500:ok?800:1700)}
function endGame(finished){
 clearInterval(timerId);const p=cur();if(!G||!p){SCREEN='menu';return render()}
 p.timeMs+=Date.now()-G.start;p.last=Date.now();
 if(!finished||(G.correct+G.wrong===0)){save(p);G.busy=true;return renderMenu()}
 SCREEN='summary';G.busy=true;
 const rec={d:Date.now(),m:G.mode,c:G.correct,t:G.correct+G.wrong,dopa:G.dopa};let top='',grade=0,newRec=false;
 if(G.mode==='five'){grade=G.correct>=10?5:G.correct>=8?4:G.correct>=6?3:2;rec.g=grade;p.fives.push({d:rec.d,g:grade,c:G.correct});if(p.fives.length>60)p.fives=p.fives.slice(-60)}
 if(G.mode==='extra'){newRec=G.correct>p.extraBest;if(newRec)p.extraBest=G.correct;rec.rec=newRec}
 p.history.unshift(rec);p.history=p.history.slice(0,50);
 const un=checkUnlocks(p);save(p);
 if(G.mode==='five'){const C={5:'#3da52a',4:'#3d9bff',3:'#ff9a1f',2:'#e05a5a'};
  top=`${LANG==='ru'||LANG==='kk'?`<div class="grade" style="color:${C[grade]}">${grade}</div>`:''}<div class="stars" aria-label="${grade}/5">${'⭐'.repeat(grade)}${'▫️'.repeat(5-grade)}</div><h2>${t('g'+grade)}</h2>`;
  if(grade===5){fireworks(8);sndFanfare();rain(120)}}
 else if(G.mode==='extra')top=`<div style="font-size:64px">${newRec?'🏆':'🚀'}</div><h2>${newRec?t('newRecord',{n:G.correct}):t('result',{n:G.correct})}</h2>${newRec?'':'<p style="font-weight:800">'+t('record',{n:p.extraBest})+'</p>'}`;
 else{top=`<div style="font-size:64px">${G.correct>=9?'🌟':G.correct>=7?'😃':'💪'}</div><h2>${G.correct>=9?t('roundGreat'):G.correct>=7?t('roundGood'):t('roundTry')}</h2>`;if(G.correct>=9){rain(80);sndFanfare()}}
 const third=REGULAR.includes(G.mode)?`<div class="slotbox">${t('sumPoints')}<b>${ms(p,G.mode).points} / 100</b></div>`:`<div class="slotbox">${t('best')}<b>${p.bestStreak} 🔥</b></div>`;
 modal(`${top}<div class="sumgrid"><div class="slotbox">${t('sumCorrect')}<b>${t('of',{a:G.correct,b:G.correct+G.wrong})}</b></div><div class="slotbox">${t('sumDopa')}<b>+${G.dopa} ⚡</b></div>${third}<div class="slotbox">${t('sumTotal')}<b>${p.dopa} ⚡</b></div></div>
  ${un.length?`<p class="lbl">${t('newRewards')} ${un.map(u=>u.k==='ava'?u.id:u.k==='frame'?esc(t('frameW',{n:fName(u.id)})):t('specialW')).join(', ')}</p>`:''}
  <div class="row"><button class="btn" data-act="menu">${t('toMenu')}</button><button class="btn pri big" data-act="again">${t('again')}</button></div>`,true,'lockm');

const otherOf=f=>f.members.find(x=>x!==SESSION);
const readKey=pid=>'arif_read_'+SESSION+'_'+pid;
const lastRead=pid=>{try{return +localStorage.getItem(readKey(pid))||0}catch(e){return 0}};
const setRead=(pid,t0)=>{try{localStorage.setItem(readKey(pid),String(t0||Date.now()))}catch(e){}};

function socialStart(){
 socialStop();if(!socialOn()||!SESSION)return;const fs=STORE.db.fs,me=SESSION;SOC.first=true;
 const beat=()=>fs.collection('presence').doc(me).set({t:Date.now()}).catch(()=>{});
 beat();SOC.hb=setInterval(()=>{if(!document.hidden)beat()},45000);
 SOC.unsubs.push(fs.collection('presence').onSnapshot(s=>{SOC.presence={};s.docs.forEach(d=>SOC.presence[d.id]=+(d.data().t)||0);socialRefresh()},()=>{}));
 SOC.unsubs.push(fs.collection('friends').where('members','array-contains',me).onSnapshot(s=>{
  const prev=SOC.friends;SOC.friends={};s.docs.forEach(d=>SOC.friends[d.id]=d.data());
  if(!SOC.first)for(const id in SOC.friends){const f=SOC.friends[id],o=prev[id],other=DB.players[otherOf(f)],nm=other?other.name:'?';
   if(!o&&f.status==='pending'&&f.by!==me){toast('👥 '+esc(t('newRequest',{n:nm})),5000);sndFanfare()}
   else if(o&&o.status==='pending'&&f.status==='ok'){toast('🎉 '+esc(t('nowFriends',{n:nm})),5000);sndFanfare()}

  SOC.first=false;socialRefresh()},()=>{}));
}

function relation(pid){const f=SOC.friends[pairId(SESSION,pid)];if(!f)return'none';if(f.status==='ok')return'friend';return f.by===SESSION?'sent':'incoming'}

function renderFriends(){

 else{

  ok.sort((a,b)=>(isOnline(otherOf(b[1]))-isOnline(otherOf(a[1])))||((b[1].last&&b[1].last.t)||0)-((a[1].last&&a[1].last.t)||0));

   ${out.map(([id,f])=>frRow(otherOf(f),`<span style="font-weight:800">${t('waiting')}</span>`)).join('')}</section>`;

 const obs=new MutationObserver(()=>{if(!document.getElementById('chatBox')){obs.disconnect();if(SOC.chatId===id){if(SOC.chatUnsub){SOC.chatUnsub();SOC.chatUnsub=null}SOC.chatId=null;socialRefresh()}}});obs.observe(document.body,{childList:true});

 if(!SOC.chatId||!socialOn()||!msgText(text))return;if(Date.now()-lastSend<1200)return;lastSend=Date.now();

/* ============ МАДЖОНГ (награда за 10 правильных подряд) ============ */
const MJ_SYM=['🍎','🍌','🍇','🍓','🍒','🥕','🌽','🍄','🐟','🐸','🐼','🦊','🐝','🌸','⭐','🌙','⚡','💎','🎈','🎲','🚀'];
const MJ={tiles:[],sel:null,hints:3,shuffles:2,after:null,hintIds:[]};
function mjLayout(){const P=[];for(let r=0;r<6;r++)for(let c=0;c<8;c++)P.push([c,r,0]);for(let r=1;r<5;r++)for(let c=1;c<7;c++)P.push([c,r,1]);
 for(let r=2;r<4;r++)for(let c=2;c<6;c++)P.push([c,r,2]);for(let r=2;r<4;r++)for(let c=3;c<5;c++)P.push([c,r,3]);return P}
const mk=(c,r,z)=>c+','+r+','+z;
function mjFreeIn(set,c,r,z){if(set.has(mk(c,r,z+1)))return false;return !set.has(mk(c-1,r,z))||!set.has(mk(c+1,r,z))}
function mjPairs(pos){for(let a=0;a<300;a++){const set=new Set(pos.map(p=>mk(...p))),left=pos.slice(),pairs=[];let ok=true;
 while(left.length){const free=left.filter(p=>mjFreeIn(set,...p));if(free.length<2){ok=false;break}
  const i=rnd(0,free.length-1);let j;do{j=rnd(0,free.length-1)}while(j===i);const A=free[i],B=free[j];pairs.push([A,B]);
  for(const p of [A,B]){set.delete(mk(...p));left.splice(left.indexOf(p),1)}}
 if(ok)return pairs}return null}
function mjDeal(){const pairs=mjPairs(mjLayout()),syms=MJ_SYM.slice().sort(()=>Math.random()-.5);let id=0;MJ.tiles=[];
 pairs.forEach((pr,k)=>{const s=syms[k%syms.length];pr.forEach(([c,r,z])=>MJ.tiles.push({id:id++,c,r,z,s,on:true}))});
 MJ.sel=null;MJ.paid=false;MJ.hints=3;MJ.shuffles=2;MJ.hintIds=[]}
const mjSet=()=>new Set(MJ.tiles.filter(x=>x.on).map(x=>mk(x.c,x.r,x.z)));
const mjFree=(x,set)=>mjFreeIn(set||mjSet(),x.c,x.r,x.z);
function mjFindPair(){const set=mjSet(),free=MJ.tiles.filter(x=>x.on&&mjFree(x,set));
 for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++)if(free[i].s===free[j].s)return[free[i],free[j]];return null}
function mjReshuffle(){const live=MJ.tiles.filter(x=>x.on),pairs=mjPairs(live.map(x=>[x.c,x.r,x.z]));if(!pairs)return false;
 const cnt={};live.forEach(x=>cnt[x.s]=(cnt[x.s]||0)+1);const sp=[];for(const s in cnt)for(let i=0;i<cnt[s]/2;i++)sp.push(s);sp.sort(()=>Math.random()-.5);
 const at={};live.forEach(x=>at[mk(x.c,x.r,x.z)]=x);pairs.forEach((pr,k)=>pr.forEach(p=>at[mk(...p)].s=sp[k]));return true}
function offerMahjong(after){
 modal(`<div style="font-size:64px">🀄</div><h2>${t('mjOffer')}</h2><p style="font-weight:800">${t('mjRules')}</p>
  <div class="row"><button class="btn" data-act="mjLater">${t('mjLater')}</button><button class="btn pri big" data-act="mjPlay" data-enter>${t('mjPlay')}</button></div>`,true,'lockm');
 MJ.after=after}
function openMahjong(){mjDeal();const w=document.createElement('div');w.className='mjwrap';w.id='mjwrap';document.body.appendChild(w);mjRender()}
function mjClose(){const w=document.getElementById('mjwrap');if(w)w.remove();const f=MJ.after;MJ.after=null;if(f)f()}
function mjRender(msg){
 const w=document.getElementById('mjwrap');if(!w)return;const set=mjSet(),live=MJ.tiles.filter(x=>x.on);
 const tw=Math.max(34,Math.min(60,Math.floor((Math.min(innerWidth,720)-40)/8.3))),th=Math.round(tw*1.28),dx=Math.round(tw*.09),dy=Math.round(tw*.11);
 const tiles=live.map(x=>{const free=mjFree(x,set);return `<button class="mjt ${free?'':'blocked'} ${MJ.sel===x.id?'sel':''} ${MJ.hintIds.includes(x.id)?'hint':''}" data-act="mjTap" data-arg="${x.id}"
  style="left:${x.c*tw-x.z*dx+3*dx}px;top:${x.r*th-x.z*dy+3*dy}px;width:${tw-2}px;height:${th-2}px;font-size:${Math.round(tw*.62)}px;z-index:${x.z*100+x.r*10+x.c}">${x.s}</button>`}).join('');
 const won=!live.length,stuck=!won&&!mjFindPair();
 w.innerHTML=`<div class="mjbar"><h2 class="on-sky" style="margin:0">🀄 ${t('mjTitle')}</h2><span class="status">${t('mjPairs',{n:live.length/2})}</span></div>
 <div class="mjbar"><button class="btn sm" data-act="mjHint" ${MJ.hints?'':'disabled'}>${t('mjHint')} (${MJ.hints})</button><button class="btn sm" data-act="mjShuffle" ${MJ.shuffles?'':'disabled'}>${t('mjShuffle')} (${MJ.shuffles})</button><button class="btn sm danger" data-act="mjExit">✖</button></div>
 ${msg||stuck?`<div class="status" style="margin-bottom:10px">${esc(msg||(MJ.shuffles?t('mjNoMoves'):t('mjLost')))}</div>`:''}
 ${won||(stuck&&!MJ.shuffles)?`<div class="modal blk" style="max-width:420px"><div style="font-size:60px">${won?'🏆':'😅'}</div><h2>${won?(MJ.paid?t('mjWin'):t('mgWinFree')):t('mjLost')}</h2>
   <div class="row"><button class="btn" data-act="mjNew">${t('mjAgain')}</button><button class="btn pri big" data-act="mjExit">${t('mjBack')}</button></div></div>`:''}
 <div class="mjboard" style="width:${8*tw+4*dx}px;height:${6*th+4*dy}px">${tiles}</div>`}
Object.assign(ACT,{
 mjLater(){closeModal();const f=MJ.after;MJ.after=null;if(f)f()},
 mjPlay(){closeModal();openMahjong()},
 mjExit(){mjClose()},
 mjNew(){mjDeal();mjRender()},
 mjTap(a){const x=MJ.tiles.find(y=>y.id===+a);if(!x||!x.on)return;
  if(!mjFree(x)){sndWrong();const el=document.querySelector(`.mjt[data-arg="${x.id}"]`);restartAnim(el,'shake');return}
  if(MJ.sel===null||MJ.sel===x.id){MJ.sel=MJ.sel===x.id?null:x.id;sndTick();return mjRender()}
  const y=MJ.tiles.find(z=>z.id===MJ.sel);
  if(y&&y.s===x.s){x.on=false;y.on=false;MJ.sel=null;MJ.hintIds=[];sndCorrect(3);
   const el=document.querySelector(`.mjt[data-arg="${x.id}"]`);if(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,14,5)}
   if(!MJ.tiles.some(z=>z.on)){const p=cur();if(p&&MJ.rw){MJ.rw=false;MJ.paid=true;p.dopa+=10;save(p);announce(checkUnlocks(p))}sndFanfare();fireworks(4);rain(60)}}
  else{MJ.sel=x.id;sndTick()}
  mjRender()},
 mjHint(){if(!MJ.hints)return toast(t('mjNoHint'));const pr=mjFindPair();if(!pr)return mjRender(t('mjNoMoves'));MJ.hints--;MJ.hintIds=pr.map(x=>x.id);MJ.sel=null;mjRender()},
 mjShuffle(){if(!MJ.shuffles)return;if(mjReshuffle()){MJ.shuffles--;MJ.sel=null;MJ.hintIds=[];sndFanfare();mjRender()}},
});

const MG={after:null,reward:false,type:null};

function offerMahjong(after){offerMinigame(after)}
function mgPickHtml(){return `<div class="mgpick">${[['maze','🐱','gMaze'],['mem','🃏','gMem'],['pz','🔢','gPz'],['mj','🀄','gMj']].map(([k,i,n])=>`<button class="btn" data-act="mgStart" data-arg="${k}"><span>${i}</span>${t(n)}</button>`).join('')}</div>`}
function offerMinigame(after){
 MG.after=after;MG.reward=true;sndFanfare();
 modal(`<div style="font-size:56px">🎮</div><h2>${t('mgOffer')}</h2>${mgPickHtml()}
  <div class="row"><button class="btn" data-act="mgLater">${t('mjLater')}</button></div>`,true,'lockm')}
function mgShell(title,rules,inner,bar){
 let w=document.getElementById('mgwrap');if(!w){w=document.createElement('div');w.className='mjwrap';w.id='mgwrap';document.body.appendChild(w)}
 w.innerHTML=`<div class="mjbar"><h2 class="on-sky" style="margin:0">${title}</h2>${bar||''}<button class="btn sm danger" data-act="mgExit">✖</button></div>
 <p class="on-sky" style="font-weight:800;max-width:560px;text-align:center;margin:0 0 6px">${rules}</p>${MG.reward?'':`<p class="on-sky" style="font-size:12px;font-weight:800;opacity:.8;margin:0 0 6px">${t('mgFree')}</p>`}
 ${inner}<div id="mgEnd"></div>`;return w}
function mgWin(){
 const p=cur();if(MG.reward&&p){p.dopa+=10;save(p);announce(checkUnlocks(p));const d=document.getElementById('dopaVal');if(d)d.textContent=p.dopa}
 sndFanfare();fireworks(4);rain(60);
 const e=document.getElementById('mgEnd');if(e)e.innerHTML=`<div class="modal blk" style="max-width:420px;margin:14px auto"><div style="font-size:60px">🏆</div><h2>${MG.reward?t('mjWin'):t('mgWinFree')}</h2>
  <div class="row"><button class="btn" data-act="mgStart" data-arg="${MG.type}">${t('mjAgain')}</button><button class="btn pri big" data-act="mgExit" data-enter>${MG.reward?t('mjBack'):t('kMenu')}</button></div></div>`;
 if(MG.reward)MG.reward=false}
function mgClose(){const w=document.getElementById('mgwrap');if(w)w.remove();MG.type=null;const f=MG.after;MG.after=null;if(f)f()}
Object.assign(ACT,{
 mgLater(){closeModal();const f=MG.after;MG.after=null;MG.reward=false;if(f)f()},

  <div class="row"><button class="btn" data-act="close">${t('kMenu')}</button></div>`)},
 mgStart(k){closeModal();MG.type=k;
  if(k==='mj'){const w=document.getElementById('mgwrap');if(w)w.remove();MJ.after=MG.after;MG.after=null;MJ.rw=MG.reward;MG.reward=false;openMahjong();return}

});

const MZ={n:7,cells:[],x:0,y:0,seen:null,done:false};
function mzGen(n){const C=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++)C.push({n:1,e:1,s:1,w:1,v:0});
 const at=(x,y)=>C[y*n+x],st=[[0,0]];at(0,0).v=1;
 const D=[[0,-1,'n','s'],[1,0,'e','w'],[0,1,'s','n'],[-1,0,'w','e']];
 while(st.length){const [x,y]=st[st.length-1],opts=D.filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<n&&ny<n&&!at(nx,ny).v});
  if(!opts.length){st.pop();continue}const [dx,dy,a,b]=pick(opts);at(x,y)[a]=0;at(x+dx,y+dy)[b]=0;at(x+dx,y+dy).v=1;st.push([x+dx,y+dy])}
 return C}
function mzStart(){const p=cur(),lvl=Math.min(4,Math.floor(((p&&+p.mzWins)||0)/2));MZ.n=[6,7,8,9,10][lvl];MZ.cells=mzGen(MZ.n);MZ.x=0;MZ.y=0;MZ.done=false;MZ.seen=new Set(['0,0']);mzRender()}
function mzRender(){
 const n=MZ.n,cs=Math.max(26,Math.min(48,Math.floor((Math.min(innerWidth,560)-32)/n)));
 const cells=MZ.cells.map((c,i)=>{const x=i%n,y=Math.floor(i/n),me=x===MZ.x&&y===MZ.y,goal=x===n-1&&y===n-1;
  return `<div class="mzc ${c.n?'n':''} ${c.e?'e':''} ${c.s?'s':''} ${c.w?'w':''} ${MZ.seen.has(x+','+y)?'seen':''}" data-act="mzTap" data-arg="${x},${y}" style="font-size:${Math.round(cs*.7)}px">${me?'🐱':goal?'🧀':''}</div>`}).join('');
 mgShell('🐱 '+t('gMaze'),t('mzRules'),`<div class="mz" id="mzBoard" style="grid-template-columns:repeat(${n},${cs}px);grid-auto-rows:${cs}px">${cells}</div>
  <div class="mzpad"><span></span><button class="btn" data-act="mzGo" data-arg="0,-1" aria-label="↑">⬆</button><span></span><button class="btn" data-act="mzGo" data-arg="-1,0" aria-label="←">⬅</button><span></span><button class="btn" data-act="mzGo" data-arg="1,0" aria-label="→">➡</button><span></span><button class="btn" data-act="mzGo" data-arg="0,1" aria-label="↓">⬇</button><span></span></div>`);
 const b=document.getElementById('mzBoard');let sx=0,sy=0;
 b.addEventListener('touchstart',e=>{const t0=e.touches[0];sx=t0.clientX;sy=t0.clientY},{passive:true});
 b.addEventListener('touchend',e=>{const t0=e.changedTouches[0],dx=t0.clientX-sx,dy=t0.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))mzMove(dx>0?1:-1,0);else mzMove(0,dy>0?1:-1)})}
function mzMove(dx,dy){if(MZ.done)return;const n=MZ.n,c=MZ.cells[MZ.y*n+MZ.x],w=dx>0?'e':dx<0?'w':dy>0?'s':'n';
 if(c[w]){sndWrong();restartAnim(document.getElementById('mzBoard'),'shake');return}
 MZ.x+=dx;MZ.y+=dy;MZ.seen.add(MZ.x+','+MZ.y);if(SET.clicks!==false)tone(660+MZ.seen.size*6,0,.06,'square',.03);
 if(MZ.x===n-1&&MZ.y===n-1){MZ.done=true;const p=cur();if(p){p.mzWins=(+p.mzWins||0)+1;save(p)}mzRender();mgWin();return}
 mzRender()}
Object.assign(ACT,{
 mzGo(a){const [dx,dy]=a.split(',').map(Number);mzMove(dx,dy)},
 mzTap(a){const [x,y]=a.split(',').map(Number),dx=x-MZ.x,dy=y-MZ.y;if(Math.abs(dx)+Math.abs(dy)===1)mzMove(dx,dy)},
});
document.addEventListener('keydown',e=>{if(!document.getElementById('mgwrap'))return;
 const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
 if(MG.type==='maze'&&K[e.key]){e.preventDefault();mzMove(...K[e.key])}
 else if(e.key==='Enter'){const b=document.querySelector('#mgEnd [data-enter]');if(b){e.preventDefault();b.click()}}},true);

const MEM={cards:[],open:[],lock:false,moves:0};
const MEM_SYM=['🐶','🐱','🐰','🦊','🐻','🐼','🐸','🐵','🦁','🐯','🐷','🐮','🐔','🐧','🦉','🐢','🐙','🦋'];
function memStart(){const p=cur(),pairs=((p&&+p.memWins)||0)>=3?8:6,s=MEM_SYM.slice().sort(()=>Math.random()-.5).slice(0,pairs);
 MEM.cards=[...s,...s].sort(()=>Math.random()-.5).map((e,i)=>({id:i,e,up:false,got:false}));MEM.open=[];MEM.lock=false;MEM.moves=0;memRender()}
function memRender(){const n=MEM.cards.length,cols=4,cw=Math.min(96,Math.floor((Math.min(innerWidth,520)-40)/cols));
 mgShell('🃏 '+t('gMem'),t('memRules'),`<div class="mem" style="grid-template-columns:repeat(${cols},${cw}px)">${MEM.cards.map(c=>`<button class="btn memc ${c.up||c.got?'':'hid'} ${c.got?'got':''}" data-act="memTap" data-arg="${c.id}">${c.e}</button>`).join('')}</div>`,
  `<span class="status" style="margin:0">${t('moves',{n:MEM.moves})}</span>`)}
Object.assign(ACT,{memTap(a){if(MEM.lock)return;const c=MEM.cards[+a];if(!c||c.up||c.got)return;c.up=true;MEM.open.push(c);sndTick();
 if(MEM.open.length===2){MEM.moves++;const [x,y]=MEM.open;
  if(x.e===y.e){x.got=y.got=true;MEM.open=[];sndCorrect(4);memRender();
   if(MEM.cards.every(z=>z.got)){const p=cur();if(p){p.memWins=(+p.memWins||0)+1;save(p)}mgWin()}return}
  MEM.lock=true;memRender();setTimeout(()=>{x.up=y.up=false;MEM.open=[];MEM.lock=false;if(MG.type==='mem')memRender()},800);return}
 memRender()}});

/* ============ ПЯТНАШКИ 3×3 ============ */
const PZ={b:[],moves:0,done:false};
const pzSolved=b=>b.every((v,i)=>v===(i===8?0:i+1));
function pzNb(i){const r=Math.floor(i/3),c=i%3,o=[];if(r>0)o.push(i-3);if(r<2)o.push(i+3);if(c>0)o.push(i-1);if(c<2)o.push(i+1);return o}
function pzStart(){const b=[1,2,3,4,5,6,7,8,0];let z=8,prev=-1;for(let k=0;k<60||pzSolved(b);k++){const o=pzNb(z).filter(x=>x!==prev),j=pick(o);b[z]=b[j];b[j]=0;prev=z;z=j}
 PZ.b=b;PZ.moves=0;PZ.done=false;pzRender()}
function pzRender(){const s=Math.min(100,Math.floor((Math.min(innerWidth,420)-56)/3));
 mgShell('🔢 '+t('gPz'),t('pzRules'),`<div class="pz" style="width:${3*s+16}px">${PZ.b.map((v,i)=>`<button class="btn pzt ${v?'':'empty'} ${v&&v===i+1?'home':''}" data-act="pzTap" data-arg="${i}">${v||''}</button>`).join('')}</div>`,
  `<span class="status" style="margin:0">${t('moves',{n:PZ.moves})}</span>`)}
Object.assign(ACT,{pzTap(a){if(PZ.done)return;const i=+a,z=PZ.b.indexOf(0);if(!pzNb(z).includes(i)){sndWrong();return}
 PZ.b[z]=PZ.b[i];PZ.b[i]=0;PZ.moves++;sndTick();
 if(pzSolved(PZ.b)){PZ.done=true;pzRender();mgWin();return}pzRender()}});

const KID_CAT=[['🍎','🍌','🍇','🍓','🍒','🍐','🍑','🍋'],['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐸'],['🚗','🚕','🚌','🚓','🚑','🚒','🚜','🚲'],['🌸','🌻','🌷','🌹','🌼','🌺','🍀','🌵']];
const KID_ITEMS=['🍎','⭐','🐟','🎈','🍓','🐞','🌸','🍪','⚽','🐥','🍄','🦋'];
const KID={n:0,total:10,ok:0,res:[],q:null,busy:false};
const rep=(e,k)=>`<span class="kidgrp">${e.repeat(k)}</span>`;
function kidOpts(a,lo,hi,k){const s=new Set([a]);let g=0;while(s.size<k&&g++<200){const v=rnd(Math.max(lo,a-3),Math.min(hi,a+3));s.add(v)}while(s.size<k)s.add(rnd(lo,hi));return [...s].sort((x,y)=>x-y)}
function kidGen(){
 const type=pick(['count','count','more','next','odd','sum','take','miss','big']),e=pick(KID_ITEMS);
 if(type==='count'){const a=rnd(1,10);return {q:t('kHowMany',{e}),body:rep(e,a),opts:kidOpts(a,1,10,4).map(v=>({h:v,ok:v===a}))}}
 if(type==='more'){let a=rnd(1,8),b;do{b=rnd(1,8)}while(b===a);const less=Math.random()<.35,e2=pick(KID_ITEMS.filter(x=>x!==e));
  return {q:t(less?'kLess':'kMore'),body:'',grp:true,opts:[{h:e.repeat(a),ok:less?a<b:a>b},{h:e2.repeat(b),ok:less?b<a:b>a}]}}
 if(type==='next'){const sets=[['🔴','🔵'],['🟡','🟢','🔴'],['⭐','🌙'],['🍎','🍎','🍌'],['🐱','🐶','🐶'],['🟥','🟦','🟩']],pat=pick(sets),len=rnd(5,7);
  const seq=[];for(let i=0;i<len;i++)seq.push(pat[i%pat.length]);const ans=pat[len%pat.length];
  const pool=[...new Set([...pat,'🟣','🟠','⚪','🍇','🐸'])].filter(x=>x!==ans).sort(()=>Math.random()-.5).slice(0,2);
  return {q:t('kNext'),body:seq.join(' ')+' ❓',emo:true,opts:[ans,...pool].sort(()=>Math.random()-.5).map(x=>({h:x,ok:x===ans}))}}
 if(type==='odd'){const ci=rnd(0,KID_CAT.length-1),A=KID_CAT[ci].slice().sort(()=>Math.random()-.5).slice(0,3),B=pick(KID_CAT.filter((_,i)=>i!==ci)),o=pick(B);
  return {q:t('kOdd'),body:'',emo:true,opts:[...A,o].sort(()=>Math.random()-.5).map(x=>({h:x,ok:x===o}))}}
 if(type==='sum'){const a=rnd(1,5),b=rnd(1,5),s=a+b;return {q:t('kSum'),body:`${rep(e,a)} ➕ ${rep(e,b)}`,opts:kidOpts(s,1,10,4).map(v=>({h:v,ok:v===s}))}}
 if(type==='take'){const a=rnd(3,9),b=rnd(1,a-1),s=a-b;return {q:t('kTake'),body:`${rep(e,a)} ➖ ${rep(e,b)}`,opts:kidOpts(s,0,9,4).map(v=>({h:v,ok:v===s}))}}
 if(type==='miss'){const st=rnd(1,6),k=rnd(1,3),seq=[0,1,2,3,4].map(i=>st+i),ans=seq[k];seq[k]='❓';
  return {q:t('kMiss'),body:seq.join(' '),opts:kidOpts(ans,1,10,4).map(v=>({h:v,ok:v===ans}))}}
 let a=rnd(1,10),b;do{b=rnd(1,10)}while(b===a);return {q:t('kBig'),body:'',opts:[a,b].map(v=>({h:v,ok:v===Math.max(a,b)}))}}
function renderKids(){SCREEN='kids';KID.busy=false;

 const q=KID.q||(KID.q=kidGen());

 <div class="kgrid">${q.opts.map((o,i)=>`<button class="btn ${q.emo?'emo':''} ${q.grp?'grp':''}" data-act="kidAns" data-arg="${i}">${o.h}</button>`).join('')}</div></section>

Object.assign(ACT,{
 kids(){KID.n=0;KID.ok=0;KID.res=[];KID.q=null;renderKids()},
 kidAns(a,btn){if(KID.busy||!KID.q)return;KID.busy=true;const o=KID.q.opts[+a],p=cur(),ok=!!(o&&o.ok);
  const bs=[...document.querySelectorAll('.kgrid .btn')];KID.q.opts.forEach((x,i)=>{if(x.ok)bs[i].classList.add('right')});
  let mg=false;

   sndCorrect(KID.ok);const r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,24,7)}

const shufA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function chkInit(){let b='';for(let r=0;r<8;r++)for(let c=0;c<8;c++)b+=(r+c)%2===1?(r<3?'b':r>4?'w':'.'):'.';return b}
function uglInit(){let b='';for(let r=0;r<8;r++)for(let c=0;c<8;c++)b+=(r>4&&c<3)?'a':(r<3&&c>4)?'b':'.';return b}

 if(r.game==='race')return {r:n,seed:rnd(1,1e9),sc:{}};
 if(r.game==='mem'){const s=shufA(MEM_SYM).slice(0,8);return {r:n,cards:shufA([...s,...s]),got:Array(16).fill(''),open:[],order:P,turn:P[0],sc:{},ot:0,win:''}}
 if(r.game==='ttt')return {r:n,b:'.........',x:P[0],o:P[1],turn:P[0],win:''};
 if(r.game==='chk')return {r:n,b:chkInit(),w:P[0],k:P[1],turn:P[0],chain:-1,win:'',n:0};
 return {r:n,b:uglInit(),a:P[0],z:P[1],turn:P[0],win:'',n:0}}

function mulb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t0=Math.imul(a^a>>>15,1|a);t0=t0+Math.imul(t0^t0>>>7,61|t0)^t0;return((t0^t0>>>14)>>>0)/4294967296}}
function raceQs(seed){const R=mulb(seed),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),Q=[];
 for(let i=0;i<10;i++){const k=ri(0,2);let q,a;if(k===0){const x=ri(2,15),y=ri(1,20-x);q=`${x} + ${y}`;a=x+y}else if(k===1){const x=ri(5,20),y=ri(1,x-1);q=`${x} − ${y}`;a=x-y}else{const x=ri(2,5),y=ri(2,5);q=`${x} × ${y}`;a=x*y}
  const o=new Set([a]);while(o.size<4){const v=a+ri(-4,4);if(v>=0)o.add(v)}Q.push({q,a,o:[...o].sort(()=>R()-.5)})}return Q}

const own=(p,col)=>p!=='.'&&p.toLowerCase()===col;
function chkCaps(b,i){const p=b[i],col=p.toLowerCase(),king=p!==col,r=Math.floor(i/8),c=i%8,out=[];
 for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){

function seaFleet(){for(let tries=0;tries<200;tries++){const b=Array(100).fill('.');let ok=true,id=0;
 for(const L of [4,3,3,2,2,2,1,1,1,1]){let placed=false;for(let k=0;k<300&&!placed;k++){const h=Math.random()<.5,x=rnd(0,h?10-L:9),y=rnd(0,h?9:10-L);let free=true;
   for(let i=0;i<L&&free;i++){const cx=x+(h?i:0),cy=y+(h?0:i);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=cx+dx,Y=cy+dy;if(X>=0&&X<10&&Y>=0&&Y<10&&b[Y*10+X]!=='.')free=false}}
   if(free){for(let i=0;i<L;i++)b[(y+(h?0:i))*10+x+(h?i:0)]=String.fromCharCode(97+id);placed=true}}
  if(!placed){ok=false;break}id++}
 if(ok)return b.join('')}return null}

 if(c==='.'){h[i]='o';u['st.turn']=op}else{h[i]='x';const cells=[...sh].map((x,k)=>x===c?k:-1).filter(k=>k>=0);
  if(cells.every(k=>h[k]==='x')){cells.forEach(k=>{const X=k%10,Y=Math.floor(k/10);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x2=X+dx,y2=Y+dy;if(x2>=0&&x2<10&&y2>=0&&y2<10&&h[y2*10+x2]==='.')h[y2*10+x2]='o'}});u['st.sunk']=(s.sunk||0)+1}

const TK={W:600,H:900,rocks:[[250,390,100,120],[40,300,50,40],[510,300,50,40],[40,560,50,40],[510,560,50,40]],base:[[300,840],[300,60]]};

const tkPath=(team,lane)=>{const lx=lane?450:150;return team===0?[[lx,760],[lx,140],[300,70]]:[[lx,140],[lx,760],[300,830]]};
function tkHostInit(st,players){return {creeps:[],cid:0,wave:0,nextWave:3,base:[800,800],pl:Object.fromEntries(players.map(p=>[p,{hp:160,dead:0,cd:0}])),shots:[],booms:[],win:-1,cdB:[0,0]}}
function tkHostStep(S,dt,tm,pos,act){if(S.win>=0)return;const now=S.time=(S.time||0)+dt;

   S.creeps.push({id:++S.cid,tm:team,lane,x:bx+(lane?30:-30)+k*14,y:by+(team?20:-20),hp:40,wp:0,cd:Math.random()})}}
 const units=[];S.creeps.forEach(c=>units.push({k:'c',o:c,tm:c.tm,x:c.x,y:c.y}));
 act.forEach(p=>{const P=S.pl[p];if(!P||P.dead>now||!pos[p])return;units.push({k:'p',id:p,o:P,tm:tm[p],x:pos[p].x,y:pos[p].y})});
 [0,1].forEach(b=>units.push({k:'b',b,tm:b,x:TK.base[b][0],y:TK.base[b][1]}));
 const near=(u,range)=>{let best=null,bd=range*range;for(const v of units){if(v.tm===u.tm)continue;if(v.k==='p'&&v.o.dead>now)continue;if(v.k==='c'&&v.o.hp<=0)continue;const d=(v.x-u.x)**2+(v.y-u.y)**2;if(d<bd){bd=d;best=v}}return best};

  if(v.k==='c'){v.o.hp-=dmg;if(v.o.hp<=0)S.booms.push([Math.round(v.x),Math.round(v.y)])}
  else if(v.k==='p'){v.o.hp-=dmg;if(v.o.hp<=0){v.o.dead=now+5;v.o.hp=160;S.booms.push([Math.round(v.x),Math.round(v.y)])}}

  if(tg){if(c.cd<=0){c.cd=1.1;hurt(tg,tg.k==='b'?10:7,c)}}

const SEA_T=['w1','w2','bowV','canV','sailV','sternV','bowH','canH','sailH','sternH','boat','fire','hitW','miss','boom','aim','ball','splash'];
(function(){const pos=k=>{const c=k%6,r=Math.floor(k/6);return `${c*20}% ${r*50}%`};
 const st=document.createElement('style');st.textContent=`:root{--seaimg:url(${SEA_IMG})}
.sb{position:absolute;inset:0;background-image:var(--seaimg);background-size:600% 300%;background-repeat:no-repeat;pointer-events:none}
.sb.dark{filter:brightness(.42) saturate(.55)}
${SEA_T.map((n,k)=>`.s-${n}{background-position:${pos(k)}}`).join('\n')}
.sea2{display:grid;grid-template-columns:repeat(10,1fr);margin:8px auto;padding:4px;background:#0d2b57;box-shadow:0 0 0 3px #000,0 6px 0 rgba(0,0,0,.35);touch-action:manipulation}
.sea2.big{width:min(380px,92vw)}.sea2.small{width:min(230px,60vw)}
.sea2 .sc{position:relative;aspect-ratio:1;border:0;padding:0;margin:0;background:#2e6fc4;overflow:hidden;cursor:default;border-radius:0}
.sea2 .sc::before{content:'';position:absolute;inset:0;z-index:5;box-shadow:inset 0 0 0 1px rgba(5,25,60,.35);pointer-events:none}
.sea2 .sc.on{cursor:pointer}
.sea2 .sc.on:hover::after,.sea2 .sc.on:focus-visible::after{content:'';position:absolute;inset:0;z-index:6;background-image:var(--seaimg);background-size:600% 300%;background-position:${pos(15)}}
.sea2 .sc:focus-visible{outline:none}
.seapad{grid-template-columns:repeat(3,58px)}
.seapad .btn:disabled{opacity:.3;cursor:not-allowed;filter:grayscale(1)}
.seahint{font-weight:800;font-size:13px;max-width:400px;margin:4px auto;line-height:1.35;height:5.6em;overflow:hidden;display:flex;align-items:center;justify-content:center}
.seah{height:2.9em;display:flex;align-items:center;justify-content:center;margin:4px 0!important}
.seaslot{height:44px;display:flex;align-items:center;justify-content:center;margin:2px 0}
.seaslot .status,.seaslot .mpturn{margin:0}
.seamodes .btn:disabled{opacity:.45;cursor:default}
.sea2.act{box-shadow:0 0 0 3px #000,0 0 0 7px #46e83f,0 0 22px 6px rgba(70,232,63,.7);animation:seaglow 1.4s ease-in-out infinite}
@keyframes seaglow{50%{box-shadow:0 0 0 3px #000,0 0 0 7px #8dff7a,0 0 32px 10px rgba(120,255,100,.85)}}
.cball.sink{animation:sink .65s ease-in forwards}
@keyframes sink{0%{filter:brightness(1);opacity:1}100%{transform:var(--sinkT,none);filter:brightness(.25) sepia(1) hue-rotate(170deg);opacity:0}}
.bub{position:fixed;z-index:199;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.15);pointer-events:none;opacity:0;animation:bub .9s ease-out forwards}
@keyframes bub{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-28px) scale(1.1)}}
.seamodes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.seamodes .btn{font-size:10px}
.cball{position:fixed;left:0;top:0;width:30px;height:30px;z-index:200;pointer-events:none;will-change:transform;transform-origin:50% 50%}
.cball .sb{filter:drop-shadow(2px 3px 0 rgba(0,0,0,.45))}
.cshadow{position:fixed;z-index:199;pointer-events:none;width:22px;height:10px;margin:-5px 0 0 -11px;border-radius:50%;background:rgba(0,0,0,.35)}

/* --- логика --- */
function seaCells(sh,c){const a=[];for(let k=0;k<100;k++)if(sh[k]===c)a.push(k);return a}
function seaSeg(sh,i){const c=sh[i],cells=seaCells(sh,c),L=cells.length;if(L===1)return 'boat';
 const hor=cells[1]-cells[0]===1,p=cells.indexOf(i),mid=p%2?'can':'sail';
 if(hor)return p===L-1?'bowH':p===0?'sternH':mid+'H';
 return p===0?'bowV':p===L-1?'sternV':mid+'V'}
function seaSunkMap(sh,h){const m={};for(let k=0;k<100;k++){const c=sh[k];if(c==='.')continue;if(m[c]===undefined)m[c]=true;if(h[k]!=='x')m[c]=false}return m}
function seaWhole(sh,h,c){return seaCells(sh,c).every(k=>h[k]!=='x')}
/* сдвиг корабля c на (dx,dy): целый, в пределах поля, не на обстрелянные клетки, не вплотную к другим */
function seaShift(sh,h,c,dx,dy){const b=sh.split(''),cells=seaCells(sh,c);if(!cells.length||cells.some(k=>h[k]==='x'))return null;
 const nc=[];for(const k of cells){const X=k%10+dx,Y=Math.floor(k/10)+dy;if(X<0||X>9||Y<0||Y>9)return null;nc.push(Y*10+X)}
 for(const k of nc){if(h[k]!=='.')return null;const X=k%10,Y=Math.floor(k/10);
  for(let ey=-1;ey<=1;ey++)for(let ex=-1;ex<=1;ex++){const x2=X+ex,y2=Y+ey;if(x2<0||x2>9||y2<0||y2>9)continue;const v=b[y2*10+x2];if(v!=='.'&&v!==c)return null}}
 cells.forEach(k=>b[k]='.');nc.forEach(k=>b[k]=c);return b.join('')}
const SEA_DIR={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
function seaCanMove(sh,h,c){return Object.values(SEA_DIR).some(([x,y])=>seaShift(sh,h,c,x,y))}
/* выстрел: возвращает обновления в формате комнаты ('st.…') */
function seaShotU(s,me,op,i){const h=s.hit[op].split('');if(h[i]!=='.')return null;
 const sh=s.sh[op],c=sh[i],u={},n=((s.last&&s.last.n)||0)+1,a=[];let sk=0;
 if(c==='.'){h[i]='o';u['st.turn']=op}
 else{h[i]='x';const cells=seaCells(sh,c);
  if(cells.every(k=>h[k]==='x')){sk=1;cells.forEach(k=>{const X=k%10,Y=Math.floor(k/10);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x2=X+dx,y2=Y+dy;if(x2>=0&&x2<10&&y2>=0&&y2<10&&h[y2*10+x2]==='.'){h[y2*10+x2]='o';a.push(y2*10+x2)}}});u['st.sunk']=(s.sunk||0)+1}
  if([...sh].every((x,k)=>x==='.'||h[k]==='x'))u['st.win']=me}
 u['st.hit.'+op]=h.join('');u['st.last']={by:me,i,c:c==='.'?0:1,sk,a,n};return u}
function seaMoveU(s,me,op,c,dx,dy){const ns=seaShift(s.sh[me],s.hit[me],c,dx,dy);if(!ns)return null;const u={['st.sh.'+me]:ns};
 if(s.turn){u['st.turn']=op;u['st.last']={by:me,mv:1,n:((s.last&&s.last.n)||0)+1}}return u}
function seaApply(obj,u){for(const k in u){const p=k.split('.');if(p[0]!=='st')continue;let o=obj;for(let j=1;j<p.length-1;j++){if(!o[p[j]])o[p[j]]={};o=o[p[j]]}o[p[p.length-1]]=u[k]}}

/* --- звуки: свист в полёте → бум при падении; промах → глухой бум + бульк --- */
function seaSnd(kind,dur){if(!SET.sound)return;const a=ac();if(!a)return;const t0=a.currentTime+.01;
 const nz=(d,type,f,q,peak,at,dl)=>{const s=a.createBufferSource(),g=a.createGain(),t=t0+(dl||0);s.buffer=noiseBuf();env(g,t,at||.004,peak,d);s.connect(filt(type,f,q)).connect(g).connect(a.destination);s.start(t,Math.random());s.stop(t+d+.2)};
 const os=(f1,f2,d,type,peak,at,dl)=>{const o=a.createOscillator(),g=a.createGain(),t=t0+(dl||0);o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,at||.005,peak,d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.2)};
 if(kind==='whistle'){const d=dur||.9,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(2300,t0);o.frequency.exponentialRampToValueAtTime(600,t0+d);
  const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=11;lg.gain.value=28;lfo.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.09,t0+d*.25);g.gain.linearRampToValueAtTime(.13,t0+d*.9);g.gain.linearRampToValueAtTime(0,t0+d);
  o.connect(g).connect(a.destination);o.start(t0);lfo.start(t0);o.stop(t0+d+.05);lfo.stop(t0+d+.05)}
 else if(kind==='boom'){nz(1,'lowpass',1000,.7,.9);os(110,32,.7,'sine',.75);nz(.25,'highpass',2200,.5,.2)}
 else if(kind==='bigboom'){nz(1.6,'lowpass',750,.7,1);os(85,24,1.2,'sine',.85);nz(.4,'highpass',2400,.5,.25);nz(1,'lowpass',400,1,.5,.01,.25)}
 else if(kind==='plop'){nz(.5,'lowpass',380,1,.6);os(70,35,.35,'sine',.45);nz(.55,'bandpass',1300,.8,.45,.02,.05);os(380,900,.12,'sine',.12,.005,.35);os(420,1100,.1,'sine',.08,.005,.55)}
 else if(kind==='click'){if(SET.clicks!==false)tone(660,0,.05,'square',.03)}}

/* --- полёт ядра: мой выстрел — от «камеры» в поле, выстрел соперника — сверху из-за экрана --- */
const SEA_FX={seen:new Set(),pend:null};
const seaReduce=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function seaBubbles(x,y,n){for(let k=0;k<n;k++){const b=document.createElement('div');b.className='bub';const s=4+Math.random()*5;
 b.style.cssText=`left:${x-s/2+(Math.random()*18-9)}px;top:${y-s/2+(Math.random()*8-4)}px;width:${s}px;height:${s}px;animation-delay:${.15+k*.12}s`;document.body.appendChild(b);setTimeout(()=>b.remove(),1700)}}
function seaBall(L,b,done){
 const el=()=>document.querySelector(`.sea2[data-b="${b}"] .sc[data-i="${L.i}"]`);
 const e0=el();if(!e0){done();return}
 if(b==='me')try{e0.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
 const T=b==='op'?950:850;
 const fxAt=(r,tile,scale)=>{const sz=r.width*scale,fx=document.createElement('div');fx.className='cfx';
  fx.style.cssText=`left:${r.left+r.width/2-sz/2}px;top:${r.top+r.height/2-sz/2}px;width:${sz}px;height:${sz}px`;fx.innerHTML=`<i class="sb s-${tile}"></i>`;document.body.appendChild(fx);setTimeout(()=>fx.remove(),900)};
 const land=ball=>{const e=el(),r=e?e.getBoundingClientRect():e0.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  if(L.c){if(ball)ball.remove();fxAt(r,'boom',1.7);seaSnd(L.sk?'bigboom':'boom');if(e)restartAnim(e.closest('.sea2'),'bigshake');burst(cx,cy,L.sk?40:18,6);done();return}
  /* промах: ядро уходит под воду */
  seaSnd('plop');fxAt(r,'splash',1.6);seaBubbles(cx,cy,5);
  if(!ball){done();return}
  const sz=Math.max(18,r.width*.7);ball.style.transition='none';ball.style.width=ball.style.height=sz+'px';
  ball.style.opacity=1;ball.style.transform=`translate(${cx-sz/2}px,${cy-sz/2}px)`;ball.style.setProperty('--sinkT',`translate(${cx-sz/2}px,${cy-sz/2+10}px) scale(.25)`);ball.classList.add('sink');
  setTimeout(()=>{ball.remove();done()},650)};
 if(seaReduce()){seaSnd('whistle',.35);setTimeout(()=>land(null),350);return}
 seaSnd('whistle',T/1000);
 const ball=document.createElement('div');ball.className='cball';ball.innerHTML='<i class="sb s-ball"></i>';
 const sh=document.createElement('div');sh.className='cshadow';document.body.appendChild(sh);document.body.appendChild(ball);
 const r0=e0.getBoundingClientRect(),cam=b==='op';
 const sx=cam?innerWidth/2:(r0.left+r0.width/2<innerWidth/2?innerWidth+40:-40),sy=cam?innerHeight*.92:-40;
 const t0=performance.now(),H=cam?Math.min(160,innerHeight*.22):Math.min(240,innerHeight*.35);
 const step=now=>{const e=el(),r=e?e.getBoundingClientRect():r0,tx=r.left+r.width/2,ty=r.top+r.height/2,bs=Math.max(18,r.width*.7);
  const p=Math.min(1,(now-t0)/T),arc=Math.sin(Math.PI*p);
  let x,y,sc,op=1;
  if(cam){const q=1-Math.pow(1-p,2.2);x=sx+(tx-sx)*q;y=sy+(ty-sy)*q-arc*H;sc=1+9*Math.pow(1-p,2.4);op=Math.min(1,p*6)}
  else{const q=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;x=sx+(tx-sx)*q;y=sy+(ty-sy)*q-arc*H;sc=1+.8*arc}
  ball.style.width=ball.style.height=bs+'px';ball.style.opacity=op;
  ball.style.transform=`translate(${x-bs/2}px,${y-bs/2}px) scale(${sc}) rotate(${p*540}deg)`;
  sh.style.left=tx+'px';sh.style.top=ty+'px';sh.style.opacity=p;sh.style.transform=`scale(${.3+p})`;
  if(p<1)requestAnimationFrame(step);else{sh.remove();land(ball)}};
 requestAnimationFrame(step)}
/* новый ход в состоянии → прятать результат, пока летит ядро */
function seaFxCheck(s,key,me,op,skip,redraw){const L=s.last;if(!L||!L.n)return;const k=key+':'+L.n;if(SEA_FX.seen.has(k))return;SEA_FX.seen.add(k);
 if(skip)return;
 if(L.mv){if(L.by!==me){setTimeout(()=>toast(esc(t('seaMovedOp')),2200),0);seaSnd('click')}return}
 const pk={key,who:L.by===me?op:me,cells:new Set([L.i,...(L.a||[])])};SEA_FX.pend=pk;
 setTimeout(()=>seaBall(L,L.by===me?'op':'me',()=>{if(SEA_FX.pend===pk)SEA_FX.pend=null;redraw()}),60)}

/* --- отрисовка --- */
function seaGrid2(b,own,sh,h,o){let out='';const sk=seaSunkMap(sh,h);
 for(let i=0;i<100;i++){const st=h[i],c=sh[i],L=[(i*7+Math.floor(i/10)*3)%9===0?'w2':'w1'];let act='';
  if(own&&c!=='.'){L.push(seaSeg(sh,i)+(sk[c]?' dark':''));if(st==='x')L.push('fire');if(o.sel===c)L.push('aim');
   if(o.selAct&&st!=='x'&&seaWhole(sh,h,c))act=`data-act="${o.selAct}" data-arg="${c}"`}
  else if(!own&&st==='x'){if(sk[c]){L.push(seaSeg(sh,i)+' dark');L.push('fire')}else L.push('hitW')}
  if(st==='o')L.push('miss');
  if(o.shoot&&st==='.')act=`data-act="${o.shoot}" data-arg="${i}"`;
  out+=`<button class="sc${act?' on':''}" data-i="${i}" ${act||'tabindex="-1"'} aria-label="${'АБВГДЕЖЗИК'[i%10]}${Math.floor(i/10)+1}">${L.map(k=>`<i class="sb s-${k}"></i>`).join('')}</button>`}
 return `<div class="sea2 ${o.big?'big':'small'}${o.act?' act':''}" data-b="${b}">${out}</div>`}
/* стрелки всегда занимают место (пустые — невидимы), чтобы экран не прыгал */
function seaArrows(P,sh,h,c){const ok=d=>c&&!!seaShift(sh,h,c,SEA_DIR[d][0],SEA_DIR[d][1]),btn=(d,s)=>`<button class="btn" data-act="${P}Mv" data-arg="${d}" ${ok(d)?'':'disabled'} aria-label="${s}">${s}</button>`;
 return `<div class="mzpad seapad" style="${c?'':'visibility:hidden'}"><span></span>${btn('u','⬆')}<span></span>${btn('l','⬅')}<span></span>${btn('r','➡')}<span></span>${btn('d','⬇')}<span></span></div>`}
function seaHitView(s,who,key){const pk=SEA_FX.pend;let h=s.hit[who];if(pk&&pk.key===key&&pk.who===who){const a=h.split('');pk.cells.forEach(k=>a[k]='.');h=a.join('')}return h}
const seaSoundBtn=()=>`<button class="btn sm" data-act="seaSound" aria-label="${SET.sound?'🔊':'🔇'}" title="${SET.sound?'🔊':'🔇'}">${SET.sound?'🔊':'🔇'}</button>`;
/* общий экран: o={pre,key,sel,mode,opName,setupTop,setupBtns,locked,turnHtml} — все строки фиксированной высоты */
function seaUI(s,me,op,o){const P=o.pre,pk=SEA_FX.pend&&SEA_FX.pend.key===o.key,hMe=seaHitView(s,me,o.key),hOp=seaHitView(s,op,o.key);
 if(!s.turn){const lock=o.locked,hint=lock?'':o.sel&&!seaCanMove(s.sh[me],hMe,o.sel)?t('seaCantMove'):t('seaSetupHint');
  return `${o.setupTop||''}<div class="seamodes">${seaSoundBtn()}</div><h3 class="seah">${t('seaMine')}</h3><p class="seahint">${esc(hint)||'&nbsp;'}</p>
  ${seaGrid2('me',true,s.sh[me],hMe,{big:true,sel:lock?null:o.sel,selAct:lock?null:P+'Sel'})}${lock?'':seaArrows(P,s.sh[me],hMe,o.sel)}${o.setupBtns||''}`}
 const myTurn=s.turn===me&&!s.win,mode=myTurn?o.mode:'shoot';let st='';
 const L=s.last;if(L&&!s.win&&!pk&&myTurn&&!L.mv&&L.by===me&&L.c)st=L.sk?t('seaSunk'):t('seaHit');
 const dis=myTurn?'':'disabled';
 const modes=`<div class="seamodes"><button class="btn sm ${myTurn&&mode==='shoot'?'pri':''}" data-act="${P}Mode" data-arg="shoot" ${dis}>${t('seaModeShoot')}</button><button class="btn sm ${myTurn&&mode==='move'?'pri':''}" data-act="${P}Mode" data-arg="move" ${dis}>${t('seaModeMove')}</button>${seaSoundBtn()}</div>`;
 const hint=!myTurn||s.win?'':mode==='move'?(o.sel&&!seaCanMove(s.sh[me],hMe,o.sel)?t('seaCantMove'):t('seaMoveHint')):t('seaShootHint');
 const head=`<div class="seaslot">${o.turnHtml||''}</div><div class="seaslot">${st?`<div class="status">${st}</div>`:''}</div>${modes}<p class="seahint">${hint?esc(hint):'&nbsp;'}</p>`;
 const enemy=big=>`<h3 class="seah">${t('seaEnemy')}: ${esc(o.opName)}</h3>${seaGrid2('op',false,s.sh[op],hOp,{big,act:big&&myTurn,shoot:big&&myTurn&&!pk?P+'Tap':null})}`;
 const mine=big=>`<h3 class="seah">${t('seaMine')}</h3>${seaGrid2('me',true,s.sh[me],hMe,{big,act:big&&myTurn,sel:big?o.sel:null,selAct:big&&!pk?P+'Sel':null})}`;
 return head+(mode==='move'?`${mine(true)}${seaArrows(P,s.sh[me],hMe,o.sel)}${enemy(false)}`:`${enemy(true)}${mine(false)}`)}

renderSea=function(r){const s=r.st,me=SESSION,op=s.order.find(x=>x!==me)||me;mpPaid(r);
 const key='mp:'+RM.id+':'+s.r;seaFxCheck(s,key,me,op,Date.now()-(+r.t||0)>6000,()=>{if(RM.room&&RM.room.game==='sea')renderMp()});

 if(s.turn==='ai'&&!s.win&&!SEA_FX.pend&&!SAI.timer)SAI.timer=setTimeout(saiAct,750+Math.random()*500);

function saiPick(){const s=SAI.s,h=s.hit.me,sh=s.sh.me,sk=seaSunkMap(sh,h),hard=SAI.lvl==='hard';
 const open=[];for(let k=0;k<100;k++)if(h[k]==='.')open.push(k);
 const wounded=[];for(let k=0;k<100;k++)if(h[k]==='x'&&!sk[sh[k]])wounded.push(k);

 if(wounded.length&&(hard||Math.random()<.6)){let cand=[];

/* --- геометрия и генератор с единственным решением --- */
const SD={geo:{},st:null,tm:null,view:null,sprOk:false};
const SD_LV=[12,12,30],SD_ICO=['🐣','🦊','🧠'],SD_GAIN=[3,6,10];
const sdBits=m=>{let c=0;while(m){m&=m-1;c++}return c};
const sdHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const sdShuf=(a,R)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function sdGeom(n,bw,bh){const key=n+'_'+bw+'_'+bh;if(SD.geo[key])return SD.geo[key];const units=[],kind=[];
 for(let r=0;r<n;r++){units.push([...Array(n)].map((_,c)=>r*n+c));kind.push('r')}for(let c=0;c<n;c++){units.push([...Array(n)].map((_,r)=>r*n+c));kind.push('c')}
 if(bw)for(let br=0;br<n/bh;br++)for(let bc=0;bc<n/bw;bc++){const u=[];for(let r=0;r<bh;r++)for(let c=0;c<bw;c++)u.push((br*bh+r)*n+bc*bw+c);units.push(u);kind.push('b')}
 const cu=[...Array(n*n)].map((_,i)=>units.map((u,k)=>u.includes(i)?k:-1).filter(k=>k>=0));
 const peers=[...Array(n*n)].map((_,i)=>{const s=new Set();cu[i].forEach(k=>units[k].forEach(j=>{if(j!==i)s.add(j)}));return[...s]});
 return SD.geo[key]={n,bw,bh,units,kind,cu,peers,full:(1<<(n+1))-2}}
const sdCand=(g,G,i)=>{let m=G.full;for(const j of G.peers[i])if(g[j])m&=~(1<<g[j]);return m};
function sdCount(g,G,limit){let cnt=0;const rec=()=>{let best=-1,bm=0,bc=99;
  for(let i=0;i<g.length;i++){if(g[i])continue;const m=sdCand(g,G,i),c=sdBits(m);if(!c)return;if(c<bc){bc=c;best=i;bm=m;if(c===1)break}}
  if(best<0){cnt++;return}for(let v=1;v<=G.n;v++)if(bm&(1<<v)){g[best]=v;rec();g[best]=0;if(cnt>=limit)return}};rec();return cnt}
/* следующий «логичный» ход: одиночка в клетке или единственное место в строке/столбце/квадрате */
function sdLogic(g,G){
 for(let i=0;i<g.length;i++){if(g[i])continue;const m=sdCand(g,G,i);if(sdBits(m)===1)return{i,v:Math.log2(m),k:'n'}}
 for(let k=0;k<G.units.length;k++){const u=G.units[k];for(let v=1;v<=G.n;v++){if(u.some(j=>g[j]===v))continue;const pl=u.filter(j=>!g[j]&&(sdCand(g,G,j)&(1<<v)));if(pl.length===1)return{i:pl[0],v,k:'h',u:k}}}
 return null}
function sdSingles(g,G){g=g.slice();for(;;){const h=sdLogic(g,G);if(!h)break;g[h.i]=h.v}return g.every(v=>v)}
function sdFull(n,bw,bh,R){const g=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)g.push((bw?(bw*(r%bh)+Math.floor(r/bh)+c):(r+c))%n+1);
 const perm=sdShuf([...Array(n)].map((_,i)=>i+1),R);
 const ord=(sz,grp)=>{if(!grp)return sdShuf([...Array(sz)].map((_,i)=>i),R);const out=[];sdShuf([...Array(sz/grp)].map((_,i)=>i),R).forEach(b=>sdShuf([...Array(grp)].map((_,i)=>i),R).forEach(x=>out.push(b*grp+x)));return out};
 const ro=ord(n,bh),co=ord(n,bw),out=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)out.push(perm[g[ro[r]*n+co[c]]-1]);return out}
function sdMake(cfg,seed){const R=srand(seed),G=sdGeom(cfg.n,cfg.bw,cfg.bh),N=cfg.n*cfg.n;let last=null;
 for(let att=0;att<(cfg.hard?24:10);att++){const sol=sdFull(cfg.n,cfg.bw,cfg.bh,R),g=sol.slice();let holes=0;
  for(const i of sdShuf([...Array(N)].map((_,i)=>i),R)){if(holes>=cfg.holes)break;const v=g[i];g[i]=0;if(sdCount(g.slice(),G,2)!==1)g[i]=v;else holes++}
  last={sol,giv:g};const easy=sdSingles(g,G);if(cfg.hard?!easy:easy)return last}
 return last}
function sdCfg(r,lv){if(r===0)return lv<=3?{n:3,bw:0,bh:0,holes:[3,4,5][lv-1],sym:'shape'}:{n:4,bw:2,bh:2,holes:Math.min(10,4+Math.round((lv-4)*6/8)),sym:'shape'};

 vilList:['📋 Списком','📋 As a list','📋 Тізіммен','📋 En lista','📋 Als Liste','📋 En liste'],

/* ключ, участок (pr,pc) на сетке 5×5, действие, аргумент */
const VIL_HOUSES=[
 ['sd',0,0,'mgStart','sd'],['mj',0,1,'mgStart','mj'],['mem',0,2,'mgStart','mem'],['pz',0,3,'mgStart','pz'],['maze',0,4,'mgStart','maze'],
 ['sea',1,0,'mgStart','sea'],['sub100',1,1,'play','sub100'],['add100',1,2,'play','add100'],['mul',1,3,'play','mul'],['bc',1,4,'mgStart','bc'],
 ['extra',2,0,'play','extra'],['sub20',2,1,'play','sub20'],['add20',2,3,'play','add20'],['five',2,4,'play','five'],
 ['kids',3,0,'kids',''],['miss',3,1,'play','miss'],['word',3,2,'play','word'],['cmp',3,3,'play','cmp'],['mp',3,4,'mp',''],
 ['stats',4,0,'stats',''],['shop',4,2,'collection','shop'],['collection',4,3,'collection',''],
];
const VIL_DECO=[['water',4,1],['trees',4,4]];
const VIL={pos:null,run:null,el:null,src:{},tw:32,th:16,X0:0,Y0:0};
const VIL_N=21,VIL_SPEED=7;
/* картинка: из папки sprites/village (при запуске с диска) или встроенная */
function vilSrc(k){if(VIL.src[k])return VIL.src[k];return VIL_IMG[k]||''}
(function(){if(location.protocol!=='file:')return;Object.keys(VIL_IMG).forEach(k=>{const im=new Image();im.onload=()=>{VIL.src[k]=im.src};im.src='sprites/village/'+k+'.png'})})();
const vilXY=(u,v)=>({x:(u-v)*VIL.tw+VIL.X0,y:(u+v)*VIL.th+VIL.Y0});
function vilName(k,act,arg){
 if(act==='play')return mName(arg);
 return ({sd:t('gSd'),mj:t('gMj'),mem:t('gMem'),pz:t('gPz'),maze:t('gMaze'),sea:t('g_sea'),bc:t('g_bc'),kids:t('kidsBtn'),mp:t('mpBtn'),stats:t('btnStats'),shop:t('shopT'),collection:t('btnCollection')})[k]||k}
/* земля рисуется один раз на холсте */
function vilGround(cv){const x=cv.getContext('2d');x.imageSmoothingEnabled=false;const L={};let left=0;const need=['grass1','grass2','grass3','plaza','lantern'];
 const draw=()=>{x.clearRect(0,0,cv.width,cv.height);let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let s=0;s<VIL_N*2-1;s++)for(let u=0;u<VIL_N;u++){const v=s-u;if(v<0||v>=VIL_N)continue;
   if(u>=9&&u<=11&&v>=9&&v<=11)continue;
   const path=u%4===0||v%4===0,r=rnd(),p=vilXY(u,v);
   if(path){const X=Math.round(p.x),Y=Math.round(p.y);x.fillStyle=r<.5?'#d8b47c':'#d2ad74';x.beginPath();x.moveTo(X,Y);x.lineTo(X+VIL.tw,Y+VIL.th);x.lineTo(X,Y+2*VIL.th);x.lineTo(X-VIL.tw,Y+VIL.th);x.closePath();x.fill();
    x.fillStyle='rgba(120,80,40,.25)';for(let i=0;i<5;i++){const a=rnd()*2-1,b=rnd()*2-1;x.fillRect(Math.round(X+(a-b)*VIL.tw*.45),Math.round(Y+VIL.th+(a+b)*VIL.th*.45),2,2)}
    if(u===VIL_N-1||v===VIL_N-1){x.fillStyle='#7a5530';x.fillRect(X-1,Y+2*VIL.th,2,6)}continue}
   const k=r<.6?'grass1':r<.8?'grass2':'grass3';const im=L[k];if(!im)continue;x.drawImage(im,Math.round(p.x-VIL.tw),Math.round(p.y))}
  if(L.plaza){const p=vilXY(9,9),w=6*VIL.tw,h=Math.round(L.plaza.height*w/L.plaza.width);x.drawImage(L.plaza,Math.round(p.x-w/2),Math.round(p.y),w,h)}
  /* фонари на перекрёстках вокруг площади и скамейка */
  [[8,8],[8,12],[12,8],[12,12]].forEach(([u,v])=>{const im=L.lantern;if(!im)return;const p=vilXY(u+.5,v+.5);x.drawImage(im,Math.round(p.x-im.width/2+14),Math.round(p.y-im.height+12))})};
 need.forEach(k=>{left++;const im=new Image();im.onload=()=>{L[k]=im;if(--left===0)draw()};im.onerror=()=>{if(--left===0)draw()};im.src=vilSrc(k)})}
function vilHtml(){const p=cur();const W=VIL_N*2*VIL.tw+40,H=VIL_N*2*VIL.th+230;VIL.X0=W/2;VIL.Y0=190;
 let h='';const objs=[];
 VIL_HOUSES.forEach(([k,pr,pc,act,arg])=>{const locked=act==='play'&&SPECIAL.includes(arg)&&!p.special;
  const b=vilXY(4*pr+4,4*pc+4),z=Math.round((8*pr+8+8*pc)*10);const nm=vilName(k,act,arg);
  let pts='';if(act==='play'&&!SPECIAL.includes(arg)){const v=p.modes[arg]?p.modes[arg].points:0;pts=`<i class="vilbar"><b style="width:${Math.min(100,v)}%"></b></i>`}
  objs.push(`<button class="vilh ${locked?'lock':''}" data-act="vilGo" data-arg="${k}" aria-label="${esc(nm)}" style="left:${b.x}px;top:${b.y+6}px;z-index:${z}"><img src="${vilSrc(k)}" alt="" draggable="false"><span class="vill">${locked?'🔒 ':''}${esc(nm)}${pts}</span></button>`)});
 VIL_DECO.forEach(([k,pr,pc])=>{const b=vilXY(4*pr+4,4*pc+4),z=Math.round((8*pr+8+8*pc)*10)-5;objs.push(`<img class="vild" src="${vilSrc(k)}" alt="" draggable="false" style="left:${b.x}px;top:${b.y+4}px;z-index:${z}">`)});
 return `<section class="vil panel blk"><div class="vilbar2"><span class="vilhint">${esc(t('vilHint'))}</span><button class="btn sm" data-act="vilToggle">${t('vilList')}</button></div>
 <div class="vilwrap" id="vilWrap"><div class="vilmap" id="vilMap" style="width:${W}px;height:${H}px"><canvas id="vilGround" width="${W}" height="${H}"></canvas>${objs.join('')}
 <div class="vildof" id="vilDof"></div><div class="vildoor" id="vilDoor" hidden></div></div></div></section>`}
/* кадры дофика: ряд 1 — вправо-вниз, ряд 2 — влево-вниз, ряд 3 — спиной (вверх), ряд 0 — стоит, 4–5 — машет/прыгает */
function vilFrame(row,col,flip){const d=VIL.el;if(!d)return;d.style.backgroundPosition=`${-col*64}px ${-row*64}px`;d.style.transform=`translate(-50%,-100%) scaleX(${flip?-1:1})`}
function vilPlace(u,v){const d=VIL.el;if(!d)return;const p=vilXY(u,v);d.style.left=p.x+'px';d.style.top=(p.y+8)+'px';d.style.zIndex=Math.round((u+v)*10)+3;VIL.pos={u,v}}
function vilStart(){VIL.el=document.getElementById('vilDof');if(!VIL.el)return;VIL.el.style.backgroundImage=`url(${vilSrc('dofik')})`;
 const P=VIL.pos||{u:12.5,v:10.5};vilPlace(P.u,P.v);vilFrame(VIL.pos?4:0,VIL.pos?2:0);
 vilGround(document.getElementById('vilGround'));
 const w=document.getElementById('vilWrap'),pp=vilXY(P.u,P.v);if(w){w.scrollLeft=Math.max(0,pp.x-w.clientWidth/2);w.scrollTop=Math.max(0,pp.y-w.clientHeight*.6)}
 clearInterval(VIL.idle);let k=0;VIL.idle=setInterval(()=>{if(VIL.run||!VIL.el||!VIL.el.isConnected){if(!VIL.el||!VIL.el.isConnected)clearInterval(VIL.idle);return}k++;
  if(k%8===6)vilFrame(5,1);else if(k%8===7)vilFrame(5,3);else vilFrame(0,k%2?2:0)},450)}
/* маршрут по дорожкам: линии u=3a+0.5 и v=3b+0.5 */
function vilRoute(P,T){const line=x=>Math.abs(((x-.5)%4+4)%4)<1e-6,near=x=>Math.max(.5,Math.min(20.5,Math.round((x-.5)/4)*4+.5));
 const pts=[];if(line(P.v)&&!line(P.u)){pts.push({u:T.u,v:P.v})}else{const C=near(T.v);if(!line(P.u))pts.push({u:near(P.u),v:P.v});const a=pts.length?pts[pts.length-1]:P;pts.push({u:a.u,v:C});pts.push({u:T.u,v:C})}
 pts.push({u:T.u,v:T.v});return pts.filter((q,i,arr)=>{const pr=i?arr[i-1]:P;return Math.abs(q.u-pr.u)+Math.abs(q.v-pr.v)>1e-6})}
ACT.vilGo=function(k){const H=VIL_HOUSES.find(x=>x[0]===k);if(!H||!VIL.el)return;const [,pr,pc,act,arg]=H;sndTick();
 const T={u:4*pr+4.5,v:4*pc+4.5},pts=vilRoute(VIL.pos||{u:12.5,v:10.5},T);let seg=0,from={...VIL.pos},t0=performance.now(),fr=0,ft=0;
 const total=pts.reduce((s,q,i)=>{const a=i?pts[i-1]:from;return s+Math.abs(q.u-a.u)+Math.abs(q.v-a.v)},0),spd=Math.max(VIL_SPEED,total/2.6);
 if(VIL.run)cancelAnimationFrame(VIL.run.raf);const R={raf:0};VIL.run=R;
 const w=document.getElementById('vilWrap');
 const step=now=>{if(VIL.run!==R||!VIL.el||!VIL.el.isConnected)return;if(seg>=pts.length){VIL.run=null;return vilEnter(T,act,arg)}
  const a=seg?pts[seg-1]:from,b=pts[seg],len=Math.abs(b.u-a.u)+Math.abs(b.v-a.v),dt=(now-t0)/1000,f=Math.min(1,dt*spd/len);
  const u=a.u+(b.u-a.u)*f,v=a.v+(b.v-a.v)*f;vilPlace(u,v);
  const du=b.u-a.u,dv=b.v-a.v,row=du>0?1:dv>0?2:3,flip=dv<0&&du===0?false:du<0;
  if(now-ft>110){ft=now;fr=(fr+1)%4}vilFrame(row,fr,row===3&&du<0);
  if(w){const p=vilXY(u,v),cx=p.x-w.scrollLeft,cy=p.y-w.scrollTop;if(cx<60||cx>w.clientWidth-60)w.scrollLeft+=(cx-w.clientWidth/2)*.08;if(cy<80||cy>w.clientHeight-40)w.scrollTop+=(cy-w.clientHeight/2)*.08}
  if(f>=1){seg++;t0=now}R.raf=requestAnimationFrame(step)};
 R.raf=requestAnimationFrame(step)};
/* у двери: дверца-портал открывается, дофик подпрыгивает и заходит */
function vilEnter(T,act,arg){const d=document.getElementById('vilDoor'),p=vilXY(T.u,T.v);if(!d){return vilAct(act,arg)}
 d.hidden=false;d.style.backgroundImage=`url(${vilSrc('door')})`;d.style.left=(p.x+22)+'px';d.style.top=(p.y+4)+'px';d.style.zIndex=Math.round((T.u+T.v)*10)+2;
 let k=0;vilFrame(4,2);const iv=setInterval(()=>{k++;d.style.backgroundPosition=`${-Math.min(3,k)*37}px 0`;if(k===2)try{tone(880,0,.08,'triangle',.05);tone(1320,.08,.1,'triangle',.05)}catch(e){}
  if(k===4){VIL.el.animate([{transform:'translate(-50%,-100%) scale(1)',opacity:1},{transform:'translate(calc(-50% + 26px),-104%) scale(.55)',opacity:0}],{duration:320,easing:'ease-in',fill:'forwards'})}
  if(k>=6){clearInterval(iv);vilAct(act,arg)}},110)}
function vilAct(act,arg){const f=ACT[act]||ACT.locked;if(act==='play'&&SPECIAL.includes(arg)&&!cur().special){(ACT.locked||(()=>{}))(arg);setTimeout(()=>{if(SCREEN==='menu')renderMenu()},50);return}
 if(act==='collection'&&arg==='shop'){ACT.collection();setTimeout(()=>{const s=document.querySelector('#app .shop');if(s)s.scrollIntoView({behavior:'smooth'})},60);return}
 if(f)f(arg)}
/* попадание по домику — по непрозрачным пикселям картинки (прозрачные углы не перехватывают нажатие) */
const VIL_MASK={};
function vilMask(k){if(VIL_MASK[k]!==undefined)return VIL_MASK[k];VIL_MASK[k]=null;const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
 const d=x.getImageData(0,0,im.width,im.height).data,a=new Uint8Array(im.width*im.height);for(let i=0;i<a.length;i++)a[i]=d[i*4+3]>40?1:0;VIL_MASK[k]={w:im.width,h:im.height,a}}catch(e){}};im.src=VIL_IMG[k];return null}
VIL_HOUSES.forEach(([k])=>vilMask(k));
function vilHit(ev){const map=document.getElementById('vilMap');if(!map)return;const r=map.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
 const hs=[...map.querySelectorAll('.vilh')].map(b=>({b,z:+b.style.zIndex||0})).sort((a,b)=>b.z-a.z);
 for(const {b} of hs){const k=b.dataset.arg,img=b.querySelector('img'),lb=b.querySelector('.vill');if(!img)continue;
  const ir=img.getBoundingClientRect(),ix=ev.clientX-ir.left,iy=ev.clientY-ir.top;
  if(lb){const lr=lb.getBoundingClientRect();if(ev.clientX>=lr.left&&ev.clientX<=lr.right&&ev.clientY>=lr.top&&ev.clientY<=lr.bottom)return k}
  if(ix<0||iy<0||ix>=ir.width||iy>=ir.height)continue;const m=VIL_MASK[k];
  if(!m)return k;const px=Math.floor(ix*m.w/ir.width),py=Math.floor(iy*m.h/ir.height);if(m.a[py*m.w+px])return k}
 /* мимо домиков — по участку земли */
 const u0=(y-VIL.Y0)/VIL.th/2+(x-VIL.X0)/VIL.tw/2,v0=(y-VIL.Y0)/VIL.th/2-(x-VIL.X0)/VIL.tw/2;const pr=Math.floor(u0/4),pc=Math.floor(v0/4);
 const H=VIL_HOUSES.find(h=>h[1]===pr&&h[2]===pc&&u0%4>=1&&v0%4>=1);return H?H[0]:null}
document.addEventListener('click',ev=>{if(!ev.target.closest||!ev.target.closest('#vilMap')||ev.detail===0)return;if(ev.target.closest('[data-act]')&&!ev.target.closest('.vilh'))return;
 const k=vilHit(ev);if(k){ev.stopPropagation();ev.preventDefault();ACT.vilGo(k)}},true);
ACT.vilToggle=function(){SET.vil=SET.vil===false;try{saveSettings()}catch(e){}renderMenu()};
const _renderMenuVIL=renderMenu;renderMenu=function(){const r=_renderMenuVIL.apply(this,arguments);if(VIL.run){cancelAnimationFrame(VIL.run.raf);VIL.run=null}
 const head=document.querySelector('#app > header.top');if(!head)return r;
 if(SET.vil===false){const h2=document.querySelector('#app > h2.on-sky');if(h2)h2.insertAdjacentHTML('beforebegin',`<div class="row" style="margin:6px 0"><button class="btn sm" data-act="vilToggle">${t('vilMap')}</button></div>`);return r}
 document.querySelectorAll('#app > h2.on-sky,#app > .modes').forEach(e=>e.classList.add('vilhide'));
 head.insertAdjacentHTML('afterend',vilHtml());vilStart();return r};
document.head.insertAdjacentHTML('beforeend',`<style>
.vilhide{display:none!important}

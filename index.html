<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Арифметика ДОФА</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Блочный мир: пиксельные панели «инвентаря» поверх параллакс-пейзажа из блоков (день/ночь) */
:root{
 --font-px:"Press Start 2P","Nunito",system-ui,sans-serif;
 --font-body:"Nunito",system-ui,"Segoe UI",sans-serif;
 --ink:#232323;--muted:#4a4a4a;
 --panel:#c6c6c6;--panel-hi:#fbfbfb;--panel-lo:#5a5a5a;--edge:#121212;
 --slot:#8b8b8b;--slot-hi:#ffffff;--slot-lo:#373737;
 --btn:#9a9a9a;--btn-hi:#d4d4d4;--btn-lo:#4a4a4a;
 --pri:#4f9a2c;--pri-hi:#8bd451;--pri-lo:#2b5a16;
 --red:#c43a3a;--red-hi:#f07a7a;--red-lo:#6e1818;
 --gold:#ffd23f;--ok:#3da52a;--bad:#cf3434;--xp:#80e026;
 --toast:#212121;--sign:#b58a55;--sign-hi:#d6ac73;--sign-lo:#6d4f2b;
 color-scheme:light;
}
body.dark{
 --ink:#ededf3;--muted:#b4b4c6;
 --panel:#34343e;--panel-hi:#5e5e6c;--panel-lo:#121216;--edge:#000;
 --slot:#22222a;--slot-hi:#4c4c58;--slot-lo:#09090c;
 --btn:#4a4a56;--btn-hi:#757584;--btn-lo:#1b1b21;
 --sign:#5b4630;--sign-hi:#7c6142;--sign-lo:#2c2014;
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font-body);color:var(--ink);background:#0d1430;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
#hype{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s}
#lens{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:radial-gradient(circle at var(--lx,50%) var(--ly,42%),rgba(255,255,255,.09) 0,rgba(255,255,255,0) 32%,rgba(0,0,0,.30) 100%)}
body[data-lvl="2"] #hype{opacity:.5;background:radial-gradient(circle,transparent 35%,#5ab0ff 130%)}
body[data-lvl="3"] #hype{opacity:.6;background:radial-gradient(circle,transparent 30%,#ff4fa3 120%)}
body[data-lvl="4"] #hype{opacity:.32;background:linear-gradient(270deg,#7f00ff,#e100ff,#ff6a00,#7f00ff);background-size:600% 600%;animation:bgmove 4s ease infinite}
body[data-lvl="5"] #hype{opacity:.45;background:linear-gradient(270deg,#ff0040,#ff9900,#ffee00,#33ff66,#00ccff,#7a00ff,#ff00cc);background-size:800% 800%;animation:bgmove 2s linear infinite}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#app{position:relative;z-index:2;max-width:940px;margin:0 auto;padding:16px 16px 48px;transform:perspective(1600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translate3d(var(--px,0),var(--py,0),0);transform-origin:50% 30vh}
h1,h2,h3{font-family:var(--font-px);font-weight:400;margin:.6em 0;line-height:1.35}
h2{font-size:16px}
h3{font-size:13px!important}
.on-sky{color:#fff;text-shadow:3px 3px 0 #2a2a2a}
/* ---- блоки ---- */
.blk{background:var(--panel);box-shadow:inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo),0 0 0 3px var(--edge)}
.slotbox{background:var(--slot);box-shadow:inset 3px 3px 0 var(--slot-lo),inset -3px -3px 0 var(--slot-hi)}
.btn{font-family:var(--font-px);font-weight:400;font-size:13px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.5);padding:13px 18px;line-height:1.35;
 background:var(--btn);box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),0 0 0 3px var(--edge);transition:filter .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);filter:brightness(.95)}
.btn.pri{background:var(--pri);box-shadow:inset 3px 3px 0 var(--pri-hi),inset -3px -3px 0 var(--pri-lo),0 0 0 3px var(--edge)}
.btn.danger{background:var(--red);box-shadow:inset 3px 3px 0 var(--red-hi),inset -3px -3px 0 var(--red-lo),0 0 0 3px var(--edge)}
.btn.big{font-size:15px;padding:16px 24px}
.btn.sm{font-size:11px;padding:10px 12px}
.icon{font-size:22px;width:46px;height:46px;display:grid;place-items:center;background:var(--btn);box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),0 0 0 3px var(--edge)}
.icon:hover{filter:brightness(1.12)}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:22px 0}
.sp{flex:1}
.muted{color:var(--muted)}
/* ---- логотип ---- */
.logo-wrap{position:relative;text-align:center;margin:14px 0 4px}
.logo{font-family:var(--font-px);font-weight:700;font-size:clamp(26px,6.4vw,58px);line-height:1.15;margin:0;color:#e9e9e9;
 text-shadow:3px 3px 0 #8a8a8a,6px 6px 0 #3a3a3a,9px 9px 0 rgba(0,0,0,.35);text-wrap:balance}
.logo span{color:var(--gold);text-shadow:3px 3px 0 #b8860b,6px 6px 0 #5c3d00,9px 9px 0 rgba(0,0,0,.35)}
.splash{display:inline-block;font-family:var(--font-px);font-weight:700;color:#ffff3c;text-shadow:2px 2px 0 #3f3f00;font-size:clamp(10px,1.8vw,14px);line-height:1.5;max-width:90%;
 transform:rotate(-8deg);animation:splash .9s ease-in-out infinite alternate;margin-top:14px}
@keyframes splash{to{transform:rotate(-8deg) scale(1.08)}}
.status{display:inline-block;font-weight:800;font-size:13px;padding:6px 10px;margin-top:10px;background:rgba(0,0,0,.45);color:#fff}
.topbar{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.sel{font-family:var(--font-px);font-weight:400;font-size:11px;color:#fff;background:var(--btn);border:0;padding:10px 12px;
 box-shadow:inset 3px 3px 0 var(--btn-hi),inset -3px -3px 0 var(--btn-lo),0 0 0 3px var(--edge);max-width:100%}
.sel option{color:#000;background:#fff}
/* ---- игроки ---- */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;padding:3px}
.pcard{padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.pcard:hover{transform:translateY(-4px)}
.pcard b{font-family:var(--font-px);font-weight:400;font-size:12px;line-height:1.5;word-break:break-word}
.pcard small{color:var(--muted);font-weight:800}
.flag{font-size:1.05em}
/* ---- аватары и рамки ---- */
.frame{position:relative;padding:5px;flex:none;display:inline-block}
.frame::before{content:"";position:absolute;inset:0;background:#7d7d7d;box-shadow:inset 2px 2px 0 rgba(255,255,255,.45),inset -2px -2px 0 rgba(0,0,0,.45)}
.frame .ava{position:relative;z-index:1;background:var(--slot);box-shadow:inset 2px 2px 0 var(--slot-lo);display:grid;place-items:center;width:100%;height:100%;line-height:1}
.frame.s{width:42px;height:42px;padding:4px}.frame.s .ava{font-size:22px}
.frame.m{width:72px;height:72px;padding:6px}.frame.m .ava{font-size:38px}
.frame.l{width:112px;height:112px;padding:8px}.frame.l .ava{font-size:60px}
.fr-bronze::before{background:repeating-linear-gradient(45deg,#a8582c 0 4px,#d98a52 4px 8px)}
.fr-silver::before{background:repeating-linear-gradient(45deg,#bdbdbd 0 4px,#f2f2f2 4px 8px)}
.fr-gold::before{background:repeating-linear-gradient(45deg,#d9a51a 0 4px,#fff07a 4px 8px)}.fr-gold{filter:drop-shadow(0 0 6px #ffd54f)}
.fr-neon::before{background:#2ee6d6}.fr-neon{filter:drop-shadow(0 0 7px #2ee6d6);animation:glow 1.6s ease-in-out infinite}
.fr-rainbow::before{background:linear-gradient(90deg,#ff3b3b,#ffa53b,#ffe63b,#4ee34e,#3bc4ff,#9b5bff);animation:hue 2s linear infinite}
.fr-fire::before{background:repeating-linear-gradient(0deg,#ff5a00 0 4px,#ffb000 4px 8px,#ff2a00 8px 12px);background-size:100% 24px;animation:lava 1s steps(6) infinite}.fr-fire{filter:drop-shadow(0 0 7px #ff6d00)}
.fr-cosmic::before{background:repeating-conic-gradient(#2a0f4f 0 25%,#8b3cf0 0 50%) 0 0/8px 8px;animation:hue 4s linear infinite}.fr-cosmic{filter:drop-shadow(0 0 7px #b14cff)}
.fr-diamond::before{background:repeating-linear-gradient(45deg,#3fd8d0 0 4px,#d4fffc 4px 8px)}.fr-diamond{filter:drop-shadow(0 0 8px #66ffff);animation:glow 2s ease-in-out infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes lava{to{background-position:0 -24px}}
@keyframes glow{50%{filter:drop-shadow(0 0 12px #9ffff6) brightness(1.15)}}
/* ---- шапка ---- */
.top{display:flex;align-items:center;gap:12px;padding:10px 12px;flex-wrap:wrap;margin:3px}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-family:var(--font-px);font-weight:400;font-size:14px;line-height:1.5;word-break:break-word}
.dopa{font-family:var(--font-px);font-weight:400;color:#c86a00;font-size:14px;display:inline-block}
body.dark .dopa{color:var(--gold)}
.dopa.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5)}}
/* ---- режимы ---- */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:3px}
.mode{--c:#7c4dff;padding:14px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode .mi{grid-row:span 2;font-size:30px;width:58px;height:58px;display:grid;place-items:center}
.mode b{font-family:var(--font-px);font-weight:400;font-size:12px;line-height:1.5}
.mode small{color:var(--muted);font-weight:800}
.xp{grid-column:1/-1;height:14px;background:#1b1b1b;box-shadow:0 0 0 2px var(--edge);margin-top:8px;overflow:hidden}
.xp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c) 0 12px,color-mix(in srgb,var(--c) 65%,#000) 12px 14px)}
.mode .pts{grid-column:1/-1;font-family:var(--font-px);font-size:9px;line-height:1.6;color:var(--muted)}
.mode.locked{filter:grayscale(1) brightness(.85);cursor:not-allowed}
/* ---- игра ---- */
.gtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gtitle{font-family:var(--font-px);font-weight:400;font-size:13px;line-height:1.5;min-width:0}
.ginfo{display:flex;justify-content:space-between;font-family:var(--font-px);font-weight:400;font-size:11px;line-height:1.6;margin:14px 2px 6px;gap:10px;flex-wrap:wrap}
.meter{position:relative;height:26px;background:#1b1b1b;box-shadow:0 0 0 3px var(--edge);overflow:hidden;margin:0 3px}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,#ffe600 0 14px,#ff9100 14px 28px,#ff1744 28px 42px,#d500f9 42px 56px);transition:width .3s}
.meter span{position:relative;display:block;text-align:center;font-family:var(--font-px);font-weight:400;font-size:10px;line-height:26px;color:#fff;text-shadow:2px 2px 0 #000}
.timer{height:10px;background:#1b1b1b;margin:10px 3px 0;overflow:hidden;box-shadow:0 0 0 2px var(--edge)}
.timer i{display:block;height:100%;width:100%;background:var(--bad)}
.arena{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;margin:18px 3px}
.qbox{padding:26px 14px 16px;text-align:center;transition:box-shadow .4s}
body[data-lvl="3"] .qbox{box-shadow:inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo),0 0 0 3px var(--edge),0 0 24px #ff4081}
body[data-lvl="4"] .qbox,body[data-lvl="5"] .qbox{box-shadow:inset 3px 3px 0 var(--panel-hi),inset -3px -3px 0 var(--panel-lo),0 0 0 3px var(--edge),0 0 40px #fff,0 0 70px #ffee00}
.q{font-family:var(--font-px);font-weight:400;font-size:clamp(24px,6.4vw,52px);line-height:1.5;white-space:nowrap;overflow-x:auto}
.q.long{font-family:var(--font-body);font-weight:800;font-size:clamp(19px,4.2vw,26px);white-space:normal;text-align:left;line-height:1.45;letter-spacing:0;padding:0 8px;max-width:62ch;margin:0 auto}
.q.long .ansline{font-family:var(--font-px);text-align:center;font-size:clamp(20px,5vw,34px);line-height:1.6;margin-top:12px}
.slot{display:inline-block;min-width:1.6em;padding:0 .2em;color:#fff;text-shadow:3px 3px 0 #3a3a3a;background:var(--slot);box-shadow:inset 4px 4px 0 var(--slot-lo),inset -4px -4px 0 var(--slot-hi)}
.slot.ok{background:#2f8f22;box-shadow:inset 4px 4px 0 #1b5a12,inset -4px -4px 0 #7fe061;animation:pop .4s}
.slot.bad{background:#b53030;box-shadow:inset 4px 4px 0 #641515,inset -4px -4px 0 #f08080}
.slot s{color:#ffd0d0;font-size:.6em}
.fb{min-height:30px;font-family:var(--font-px);font-size:14px;font-weight:400;line-height:1.6;margin-top:14px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.tblrow{text-align:center;margin:0 0 18px}
.work{display:flex;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;flex:1 1 300px;padding:3px}
.pad button{font-family:var(--font-px);font-size:24px;height:66px}
.pad .okb{background:var(--pri);box-shadow:inset 3px 3px 0 var(--pri-hi),inset -3px -3px 0 var(--pri-lo),0 0 0 3px var(--edge)}
.pad .del{background:var(--red);box-shadow:inset 3px 3px 0 var(--red-hi),inset -3px -3px 0 var(--red-lo),0 0 0 3px var(--edge)}
.cmppad button{height:96px;font-size:40px}
.chpad{grid-template-columns:repeat(5,1fr);max-width:600px;flex-basis:100%}
.chpad button{height:80px;font-size:clamp(16px,4.6vw,26px);padding:0}
.tblrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.frow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:10px 3px;color:#fff;text-shadow:1px 1px 0 #000;flex-wrap:wrap}
.frn{font-family:var(--font-px);font-weight:400;font-size:12px;line-height:1.5;word-break:break-word}
.dot{width:12px;height:12px;flex:none;display:inline-block;background:#8a8a8a;box-shadow:0 0 0 2px #000}
.dot.on{background:#46e83f;box-shadow:0 0 0 2px #000,0 0 8px #46e83f}
.badge{display:inline-block;background:#e33;color:#fff;font-family:var(--font-px);font-size:10px;padding:3px 6px;box-shadow:0 0 0 2px #000;text-shadow:none}
.chathead{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px}
.chat{height:38vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px;text-align:left;margin:3px}
.msg{max-width:82%;align-self:flex-start;padding:8px 10px;font-weight:800;color:#fff;background:#4c4c5a;box-shadow:0 0 0 2px #000;word-break:break-word}
.msg.me{align-self:flex-end;background:#3a8a28}
.msg small{display:block;font-size:10px;opacity:.75;margin-top:2px}
.phr{display:flex;flex-wrap:wrap;gap:10px;margin:14px 3px 6px;max-height:24vh;overflow-y:auto;padding:3px;justify-content:center}
.phr .btn{font-size:10px;padding:8px 9px}
.phr.emo .btn{font-size:20px;padding:6px 8px}
.mjwrap{position:fixed;inset:0;z-index:85;background:rgba(8,10,26,.86);display:flex;flex-direction:column;align-items:center;padding:12px 8px 24px;overflow:auto}
.mjbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin:6px 0 10px}
.mjboard{position:relative;flex:none;margin:8px auto}
.mjt{position:absolute;display:grid;place-items:center;padding:0;line-height:1;background:#f3ead2;border-radius:3px;
 box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #b9a47a,3px 4px 0 #6b5a3a,4px 6px 0 rgba(0,0,0,.35);transition:transform .1s}
.mjt.blocked{filter:brightness(.62) saturate(.7)}
.mjt.sel{background:#ffe066;outline:3px solid #ff9100;transform:translateY(-3px)}
.mjt.hint{animation:mjh .5s ease-in-out infinite alternate}
@keyframes mjh{to{background:#a8ffb5;transform:translateY(-4px)}}
.kidq{font-size:clamp(26px,7vw,40px);line-height:1.35;margin:10px 0 14px;word-break:break-word;letter-spacing:2px}
.kidgrp{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.kgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.kgrid .btn{min-width:72px;font-size:22px;padding:14px 16px}
.kgrid .btn.emo{font-size:34px;padding:10px 14px}
.kgrid .btn.grp{font-size:24px;max-width:46%;padding:12px;line-height:1.25}
.kgrid .btn.right{background:#3a8a28}
.kgrid .btn.bad{background:#a32a2a}
.kprog{display:flex;gap:6px;justify-content:center;margin:6px 0 4px;flex-wrap:wrap}
.kprog i{width:16px;height:16px;background:#555;box-shadow:0 0 0 2px #000}
.kprog i.ok{background:#46e83f}.kprog i.no{background:#e33}.kprog i.now{background:#ffd23f}
.mgpick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.mgpick .btn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;padding:14px 8px}
.mgpick .btn span{font-size:34px;line-height:1}
.mz{display:grid;margin:8px auto;background:#2b2b38;box-shadow:0 0 0 4px #000;touch-action:none;flex:none}
.mzc{position:relative;box-sizing:border-box;display:grid;place-items:center;line-height:1;background:#e9dfc0}
.mzc.n{border-top:3px solid #3b2a14}.mzc.s{border-bottom:3px solid #3b2a14}.mzc.w{border-left:3px solid #3b2a14}.mzc.e{border-right:3px solid #3b2a14}
.mzc.seen{background:#c8f0b8}
.mzpad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin-top:10px}
.mzpad .btn{font-size:22px;padding:10px 0}
.mem{display:grid;gap:10px;margin:10px auto;flex:none}
.memc{aspect-ratio:3/4;display:grid;place-items:center;font-size:clamp(26px,8vw,42px);padding:0;line-height:1}
.memc.hid{color:transparent;text-shadow:none}
.memc.hid::after{content:'❓';color:#fff;font-size:.7em;text-shadow:2px 2px 0 #000}
.memc.got{background:#3a8a28;opacity:.75}
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px auto;flex:none}
.pzt{aspect-ratio:1;font-size:clamp(28px,9vw,44px);padding:0;display:grid;place-items:center}
.pzt.empty{visibility:hidden}
.pzt.home{background:#3a8a28}
.mpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.mpgrid .btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;font-size:11px}
.mpgrid .btn span{font-size:36px;line-height:1}
.mpgrid .btn small{font-family:inherit;font-size:9px;opacity:.85}
.mpq{font-family:var(--font-px);font-size:clamp(24px,7vw,40px);margin:12px 0;color:#fff;text-shadow:3px 3px 0 #000}
.mpbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:800;color:#fff;text-shadow:1px 1px 0 #000;text-align:left}
.mpbar .tr{flex:1;height:14px;background:#333;box-shadow:0 0 0 2px #000;position:relative}
.mpbar .tr i{position:absolute;left:0;top:0;bottom:0;background:#46e83f}
.mpbar.me .tr i{background:#ffd23f}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(300px,80vw);margin:12px auto}
.ttt .btn{aspect-ratio:1;font-size:clamp(30px,10vw,52px);padding:0;display:grid;place-items:center}
.ttt .btn.wl{background:#3a8a28}
.mpmem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(380px,90vw);margin:12px auto}
.mpmem .btn{aspect-ratio:3/4;font-size:clamp(24px,8vw,40px);padding:0;display:grid;place-items:center;line-height:1}
.mpmem .btn.hid{color:transparent;text-shadow:none}
.mpmem .btn.hid::after{content:'❓';color:#fff;font-size:.7em;text-shadow:2px 2px 0 #000}

 finally{STORE.flushing=false}}

function buses(){const a=ac();if(!a)return null;

function playStep(st,t,spb){
 const T=MS.T,ch=T.ch[Math.floor(st/16)%T.ch.length],s=st%16,tt=t+(s%2?T.sw*spb:0);
 if(s===0){ch.forEach((n,i)=>mKeys(n,tt+i*.015,spb*15,.045));mBass(ch[0]-12,tt,spb*6)}

function startGame(m){
 SCREEN='game';closeModal();clearInterval(timerId);const p=cur();
 G={mode:m,n:0,total:m==='extra'?Infinity:10,correct:0,wrong:0,streak:0,dopa:0,input:'',busy:false,lives:3,start:Date.now(),last:'',tblOpen:m==='mul'&&!MOBILE,padType:null};
 const M=MODES[m];
 app.innerHTML=`<div id="game"><header class="gtop top blk"><button class="icon" data-act="quit" title="✖" aria-label="${esc(t('toMenu'))}">✖</button><div class="gtitle">${M.icon} ${esc(mName(m))}</div><div class="sp"></div>

 <div class="ginfo on-sky"><span id="prog"></span><span id="extraInfo"></span></div>
 <div class="meter"><i id="meter"></i><span id="meterTxt"></span></div>
 ${m==='extra'?'<div class="timer"><i id="timer"></i></div>':''}
 <div class="arena"><div class="side"><div class="bubble" id="bubble">${esc(t('mascotHi'))}</div><div class="mascot m-idle" id="mascot">${MASCOT_SVG}</div></div>
 <div class="qbox blk" id="qbox"><div class="q" id="q"></div><div class="fb" id="fb" aria-live="polite"></div></div></div>
 <div class="tblrow"><button class="btn sm" id="chBtn" data-act="toggleChoices"></button><button class="btn sm" id="tblBtn" data-act="toggleTable" hidden></button></div>
 <div class="work"><div class="ptable blk" id="ptable" hidden></div><div class="pad" id="pad"></div></div></div>`;
 updateMeter();nextQ()}
function makeOpts(q){const a=+q.a,s=new Set([a]),m=q.t.match(/(\d+) × (\d+)/),near=[a+1,a-1,a+2,a-2,a+3,a-3],far=[a+10,a-10];
 let cand=[];if(m){const x=+m[1],y=+m[2];cand.push(x*(y+1),x*(y-1),(x+1)*y,(x-1)*y)}
 if(a>=12&&a%11){const r=+String(a).split('').reverse().join('');cand.push(r)}
 if(a>=20)cand.push(...far);cand.push(...near.sort(()=>Math.random()-.5));
 for(const c of cand){if(s.size>=5)break;if(c>=0&&c<=200)s.add(c)}
 while(s.size<5){const c=a+rnd(-9,9);if(c>=0)s.add(c)}
 return [...s].sort(()=>Math.random()-.5)}
function renderPad(cmp){const ch=!cmp&&SET.choices;const key=cmp?'cmp':ch?'ch:'+G.q.t:'num';
 const cb=document.getElementById('chBtn');if(cb){cb.hidden=!!cmp;cb.textContent=SET.choices?t('kbMode'):t('choiceMode')}
 if(G.padType===key)return;G.padType=key;const pad=document.getElementById('pad');
 pad.className='pad'+(cmp?' cmppad':ch?' chpad':'');
 if(ch){G.q.opts=G.q.opts||makeOpts(G.q);pad.innerHTML=G.q.opts.map(v=>`<button class="btn" data-act="key" data-arg="c${v}">${v}</button>`).join('');return}
 pad.innerHTML=cmp?[['lt','<'],['eq','='],['gt','>']].map(([k,s])=>`<button class="btn" data-act="key" data-arg="${k}">${esc(s)}</button>`).join('')
 :[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" data-act="key" data-arg="${n}">${n}</button>`).join('')+`<button class="btn del" data-act="key" data-arg="del" aria-label="⌫">⌫</button><button class="btn" data-act="key" data-arg="0">0</button><button class="btn okb" data-act="key" data-arg="ok">OK</button>`}
function updateMeter(){
 const s=G.streak,mult=Math.min(5,1+Math.floor((s+1)/5));
 document.getElementById('meter').style.width=Math.min(100,s/15*100)+'%';
 document.getElementById('meterTxt').textContent=s?t('meter',{s,m:mult}):t('meterIdle');
 const p=cur(),ei=document.getElementById('extraInfo');
 if(G.mode==='extra')ei.textContent='❤️'.repeat(Math.max(0,G.lives))+'🖤'.repeat(Math.max(0,3-G.lives))+'  '+t('record',{n:p.extraBest});
 else if(G.mode==='five')ei.textContent=t('correctN',{n:G.correct});
 else ei.textContent=t('points',{n:ms(p,G.mode).points})}
function nextQ(){
 if(G.n>=G.total)return endGame(true);
 G.n++;let q,guard=0;do{q=MODES[G.mode].gen()}while(q.t===G.last&&guard++<20);G.q=q;G.last=q.t;G.input='';G.busy=false;
 document.getElementById('prog').textContent=G.mode==='extra'?t('qNum',{n:G.n}):t('qOf',{n:G.n,t:G.total});
 G.padType=null;renderPad(!!q.cmp);const qe=document.getElementById('q');qe.className='q'+(q.long?' long':'');
 qe.innerHTML=q.long?`<div>${esc(q.t)}</div><div class="ansline">${t('answerLbl')} <span class="slot" id="slot">?</span></div>`:esc(q.t).replace('□','<span class="slot" id="slot">?</span>');
 updateTable();
 const fb=document.getElementById('fb');fb.textContent='';fb.className='fb';
 if(G.mode==='extra')startTimer()}
function drawSlot(){document.getElementById('slot').textContent=G.input||'?'}
const SIGNS={lt:'<',eq:'=',gt:'>'};
function press(k){
 if(!G||G.busy||!G.q)return;
 if(G.q.cmp){if(SIGNS[k]){G.input=SIGNS[k];sndTick();drawSlot();submit()}return}
 if(SIGNS[k])return;
 if(/^c\d+$/.test(k)){G.input=k.slice(1);sndTick();drawSlot();return submit()}
 if(k==='ok')return submit();
 if(k==='del')G.input=G.input.slice(0,-1);else if(G.input.length<3)G.input=(G.input==='0'?'':G.input)+k;
 sndTick();drawSlot()}
function startTimer(){clearInterval(timerId);const T=12000,t0=Date.now(),el=document.getElementById('timer');
 timerId=setInterval(()=>{const left=Math.max(0,1-(Date.now()-t0)/T);el.style.width=left*100+'%';
  if(left<=0){clearInterval(timerId);if(!G.busy){G.busy=true;answer(false)}}},80)}
function submit(){if(!G.input)return;G.busy=true;clearInterval(timerId);answer(String(G.input)===String(G.q.a))}
function answer(ok){
 let hit100=false;const p=cur(),reg=REGULAR.includes(G.mode),st=reg?ms(p,G.mode):null,slot=document.getElementById('slot'),fb=document.getElementById('fb');
 if(ok){
  G.streak++;G.correct++;p.correct++;if(G.streak>p.bestStreak)p.bestStreak=G.streak;
  const gain=Math.min(5,1+Math.floor(G.streak/5));p.dopa+=gain;G.dopa+=gain;
  if(st){const before=st.points;st.correct++;st.points=Math.min(100,st.points+(G.streak>=10?2:1));if(before<100&&st.points>=100){hit100=true;setTimeout(moneyThrow,450)}}
  if(mgTick())G.mjOffer=true;slot.classList.add('ok');mascot(G.streak>=5?'joy':'happy');fb.textContent=pick(tl('praise'));fb.className='fb ok';
  document.getElementById('dopaVal').textContent=p.dopa;celebrate(G.streak,gain)}
 else{
  G.streak=0;G.wrong++;p.wrong++;if(st)st.wrong++;if(G.mode==='extra')G.lives--;
  slot.className='slot bad';slot.innerHTML=(G.input?`<s>${esc(G.input)}</s> `:'')+esc(G.q.a);
  fb.textContent=G.input?t('almost',{a:G.q.a}):t('timeout',{a:G.q.a});fb.className='fb bad';
  document.body.dataset.lvl=0;restartAnim(document.getElementById('qbox'),'shake');sndWrong();mascot('sad')}
 updateMeter();const un=checkUnlocks(p);save(p);announce(un);
 setTimeout(()=>{if(SCREEN!=='game')return;if(G.mode==='extra'&&G.lives<=0)endGame(true);else if(G.mjOffer){G.mjOffer=false;offerMahjong(()=>{if(SCREEN==='game')nextQ()})}else nextQ()},hit100?3500:ok?800:1700)}
function endGame(finished){
 clearInterval(timerId);const p=cur();if(!G||!p){SCREEN='menu';return render()}
 p.timeMs+=Date.now()-G.start;p.last=Date.now();
 if(!finished||(G.correct+G.wrong===0)){save(p);G.busy=true;return renderMenu()}

const MJ_SYM=['🍎','🍌','🍇','🍓','🍒','🥕','🌽','🍄','🐟','🐸','🐼','🦊','🐝','🌸','⭐','🌙','⚡','💎','🎈','🎲','🚀'];
const MJ={tiles:[],sel:null,hints:3,shuffles:2,after:null,hintIds:[]};
function mjLayout(){const P=[];for(let r=0;r<6;r++)for(let c=0;c<8;c++)P.push([c,r,0]);for(let r=1;r<5;r++)for(let c=1;c<7;c++)P.push([c,r,1]);
 for(let r=2;r<4;r++)for(let c=2;c<6;c++)P.push([c,r,2]);for(let r=2;r<4;r++)for(let c=3;c<5;c++)P.push([c,r,3]);return P}
const mk=(c,r,z)=>c+','+r+','+z;
function mjFreeIn(set,c,r,z){if(set.has(mk(c,r,z+1)))return false;return !set.has(mk(c-1,r,z))||!set.has(mk(c+1,r,z))}
function mjPairs(pos){for(let a=0;a<300;a++){const set=new Set(pos.map(p=>mk(...p))),left=pos.slice(),pairs=[];let ok=true;
 while(left.length){const free=left.filter(p=>mjFreeIn(set,...p));if(free.length<2){ok=false;break}
  const i=rnd(0,free.length-1);let j;do{j=rnd(0,free.length-1)}while(j===i);const A=free[i],B=free[j];pairs.push([A,B]);
  for(const p of [A,B]){set.delete(mk(...p));left.splice(left.indexOf(p),1)}}
 if(ok)return pairs}return null}
function mjDeal(){const pairs=mjPairs(mjLayout()),syms=MJ_SYM.slice().sort(()=>Math.random()-.5);let id=0;MJ.tiles=[];
 pairs.forEach((pr,k)=>{const s=syms[k%syms.length];pr.forEach(([c,r,z])=>MJ.tiles.push({id:id++,c,r,z,s,on:true}))});
 MJ.sel=null;MJ.paid=false;MJ.hints=3;MJ.shuffles=2;MJ.hintIds=[]}
const mjSet=()=>new Set(MJ.tiles.filter(x=>x.on).map(x=>mk(x.c,x.r,x.z)));
const mjFree=(x,set)=>mjFreeIn(set||mjSet(),x.c,x.r,x.z);
function mjFindPair(){const set=mjSet(),free=MJ.tiles.filter(x=>x.on&&mjFree(x,set));
 for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++)if(free[i].s===free[j].s)return[free[i],free[j]];return null}
function mjReshuffle(){const live=MJ.tiles.filter(x=>x.on),pairs=mjPairs(live.map(x=>[x.c,x.r,x.z]));if(!pairs)return false;
 const cnt={};live.forEach(x=>cnt[x.s]=(cnt[x.s]||0)+1);const sp=[];for(const s in cnt)for(let i=0;i<cnt[s]/2;i++)sp.push(s);sp.sort(()=>Math.random()-.5);
 const at={};live.forEach(x=>at[mk(x.c,x.r,x.z)]=x);pairs.forEach((pr,k)=>pr.forEach(p=>at[mk(...p)].s=sp[k]));return true}
function offerMahjong(after){

 MJ.after=after}
function openMahjong(){mjDeal();const w=document.createElement('div');w.className='mjwrap';w.id='mjwrap';document.body.appendChild(w);mjRender()}
function mjClose(){const w=document.getElementById('mjwrap');if(w)w.remove();const f=MJ.after;MJ.after=null;if(f)f()}
function mjRender(msg){
 const w=document.getElementById('mjwrap');if(!w)return;const set=mjSet(),live=MJ.tiles.filter(x=>x.on);
 const tw=Math.max(34,Math.min(60,Math.floor((Math.min(innerWidth,720)-40)/8.3))),th=Math.round(tw*1.28),dx=Math.round(tw*.09),dy=Math.round(tw*.11);
 const tiles=live.map(x=>{const free=mjFree(x,set);return `<button class="mjt ${free?'':'blocked'} ${MJ.sel===x.id?'sel':''} ${MJ.hintIds.includes(x.id)?'hint':''}" data-act="mjTap" data-arg="${x.id}"
  style="left:${x.c*tw-x.z*dx+3*dx}px;top:${x.r*th-x.z*dy+3*dy}px;width:${tw-2}px;height:${th-2}px;font-size:${Math.round(tw*.62)}px;z-index:${x.z*100+x.r*10+x.c}">${x.s}</button>`}).join('');
 const won=!live.length,stuck=!won&&!mjFindPair();
 w.innerHTML=`<div class="mjbar"><h2 class="on-sky" style="margin:0">🀄 ${t('mjTitle')}</h2><span class="status">${t('mjPairs',{n:live.length/2})}</span></div>
 <div class="mjbar"><button class="btn sm" data-act="mjHint" ${MJ.hints?'':'disabled'}>${t('mjHint')} (${MJ.hints})</button><button class="btn sm" data-act="mjShuffle" ${MJ.shuffles?'':'disabled'}>${t('mjShuffle')} (${MJ.shuffles})</button><button class="btn sm danger" data-act="mjExit">✖</button></div>
 ${msg||stuck?`<div class="status" style="margin-bottom:10px">${esc(msg||(MJ.shuffles?t('mjNoMoves'):t('mjLost')))}</div>`:''}
 ${won||(stuck&&!MJ.shuffles)?`<div class="modal blk" style="max-width:420px"><div style="font-size:60px">${won?'🏆':'😅'}</div><h2>${won?(MJ.paid?t('mjWin'):t('mgWinFree')):t('mjLost')}</h2>
   <div class="row"><button class="btn" data-act="mjNew">${t('mjAgain')}</button><button class="btn pri big" data-act="mjExit">${t('mjBack')}</button></div></div>`:''}
 <div class="mjboard" style="width:${8*tw+4*dx}px;height:${6*th+4*dy}px">${tiles}</div>`}

 mjLater(){closeModal();const f=MJ.after;MJ.after=null;if(f)f()},

 mjTap(a){const x=MJ.tiles.find(y=>y.id===+a);if(!x||!x.on)return;
  if(!mjFree(x)){sndWrong();const el=document.querySelector(`.mjt[data-arg="${x.id}"]`);restartAnim(el,'shake');return}
  if(MJ.sel===null||MJ.sel===x.id){MJ.sel=MJ.sel===x.id?null:x.id;sndTick();return mjRender()}
  const y=MJ.tiles.find(z=>z.id===MJ.sel);
  if(y&&y.s===x.s){x.on=false;y.on=false;MJ.sel=null;MJ.hintIds=[];sndCorrect(3);
   const el=document.querySelector(`.mjt[data-arg="${x.id}"]`);if(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,14,5)}
   if(!MJ.tiles.some(z=>z.on)){const p=cur();if(p&&MJ.rw){MJ.rw=false;MJ.paid=true;p.dopa+=10;save(p);announce(checkUnlocks(p))}sndFanfare();fireworks(4);rain(60)}}
  else{MJ.sel=x.id;sndTick()}
  mjRender()},
 mjHint(){if(!MJ.hints)return toast(t('mjNoHint'));const pr=mjFindPair();if(!pr)return mjRender(t('mjNoMoves'));MJ.hints--;MJ.hintIds=pr.map(x=>x.id);MJ.sel=null;mjRender()},
 mjShuffle(){if(!MJ.shuffles)return;if(mjReshuffle()){MJ.shuffles--;MJ.sel=null;MJ.hintIds=[];sndFanfare();mjRender()}},
});

const MZ={n:7,cells:[],x:0,y:0,seen:null,done:false};
function mzGen(n){const C=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++)C.push({n:1,e:1,s:1,w:1,v:0});
 const at=(x,y)=>C[y*n+x],st=[[0,0]];at(0,0).v=1;
 const D=[[0,-1,'n','s'],[1,0,'e','w'],[0,1,'s','n'],[-1,0,'w','e']];
 while(st.length){const [x,y]=st[st.length-1],opts=D.filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<n&&ny<n&&!at(nx,ny).v});
  if(!opts.length){st.pop();continue}const [dx,dy,a,b]=pick(opts);at(x,y)[a]=0;at(x+dx,y+dy)[b]=0;at(x+dx,y+dy).v=1;st.push([x+dx,y+dy])}
 return C}
function mzStart(){const p=cur(),lvl=Math.min(4,Math.floor(((p&&+p.mzWins)||0)/2));MZ.n=[6,7,8,9,10][lvl];MZ.cells=mzGen(MZ.n);MZ.x=0;MZ.y=0;MZ.done=false;MZ.seen=new Set(['0,0']);mzRender()}
function mzRender(){
 const n=MZ.n,cs=Math.max(26,Math.min(48,Math.floor((Math.min(innerWidth,560)-32)/n)));
 const cells=MZ.cells.map((c,i)=>{const x=i%n,y=Math.floor(i/n),me=x===MZ.x&&y===MZ.y,goal=x===n-1&&y===n-1;
  return `<div class="mzc ${c.n?'n':''} ${c.e?'e':''} ${c.s?'s':''} ${c.w?'w':''} ${MZ.seen.has(x+','+y)?'seen':''}" data-act="mzTap" data-arg="${x},${y}" style="font-size:${Math.round(cs*.7)}px">${me?'🐱':goal?'🧀':''}</div>`}).join('');
 mgShell('🐱 '+t('gMaze'),t('mzRules'),`<div class="mz" id="mzBoard" style="grid-template-columns:repeat(${n},${cs}px);grid-auto-rows:${cs}px">${cells}</div>
  <div class="mzpad"><span></span><button class="btn" data-act="mzGo" data-arg="0,-1" aria-label="↑">⬆</button><span></span><button class="btn" data-act="mzGo" data-arg="-1,0" aria-label="←">⬅</button><span></span><button class="btn" data-act="mzGo" data-arg="1,0" aria-label="→">➡</button><span></span><button class="btn" data-act="mzGo" data-arg="0,1" aria-label="↓">⬇</button><span></span></div>`);
 const b=document.getElementById('mzBoard');let sx=0,sy=0;
 b.addEventListener('touchstart',e=>{const t0=e.touches[0];sx=t0.clientX;sy=t0.clientY},{passive:true});
 b.addEventListener('touchend',e=>{const t0=e.changedTouches[0],dx=t0.clientX-sx,dy=t0.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))mzMove(dx>0?1:-1,0);else mzMove(0,dy>0?1:-1)})}
function mzMove(dx,dy){if(MZ.done)return;const n=MZ.n,c=MZ.cells[MZ.y*n+MZ.x],w=dx>0?'e':dx<0?'w':dy>0?'s':'n';
 if(c[w]){sndWrong();restartAnim(document.getElementById('mzBoard'),'shake');return}
 MZ.x+=dx;MZ.y+=dy;MZ.seen.add(MZ.x+','+MZ.y);tone(660+MZ.seen.size*6,0,.06,'square',.03);
 if(MZ.x===n-1&&MZ.y===n-1){MZ.done=true;const p=cur();if(p){p.mzWins=(+p.mzWins||0)+1;save(p)}mzRender();mgWin();return}
 mzRender()}
Object.assign(ACT,{
 mzGo(a){const [dx,dy]=a.split(',').map(Number);mzMove(dx,dy)},
 mzTap(a){const [x,y]=a.split(',').map(Number),dx=x-MZ.x,dy=y-MZ.y;if(Math.abs(dx)+Math.abs(dy)===1)mzMove(dx,dy)},
});

 const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};

const PZ={b:[],moves:0,done:false};
const pzSolved=b=>b.every((v,i)=>v===(i===8?0:i+1));
function pzNb(i){const r=Math.floor(i/3),c=i%3,o=[];if(r>0)o.push(i-3);if(r<2)o.push(i+3);if(c>0)o.push(i-1);if(c<2)o.push(i+1);return o}
function pzStart(){const b=[1,2,3,4,5,6,7,8,0];let z=8,prev=-1;for(let k=0;k<60||pzSolved(b);k++){const o=pzNb(z).filter(x=>x!==prev),j=pick(o);b[z]=b[j];b[j]=0;prev=z;z=j}
 PZ.b=b;PZ.moves=0;PZ.done=false;pzRender()}
function pzRender(){const s=Math.min(100,Math.floor((Math.min(innerWidth,420)-56)/3));
 mgShell('🔢 '+t('gPz'),t('pzRules'),`<div class="pz" style="width:${3*s+16}px">${PZ.b.map((v,i)=>`<button class="btn pzt ${v?'':'empty'} ${v&&v===i+1?'home':''}" data-act="pzTap" data-arg="${i}">${v||''}</button>`).join('')}</div>`,
  `<span class="status" style="margin:0">${t('moves',{n:PZ.moves})}</span>`)}
Object.assign(ACT,{pzTap(a){if(PZ.done)return;const i=+a,z=PZ.b.indexOf(0);if(!pzNb(z).includes(i)){sndWrong();return}
 PZ.b[z]=PZ.b[i];PZ.b[i]=0;PZ.moves++;sndTick();
 if(pzSolved(PZ.b)){PZ.done=true;pzRender();mgWin();return}pzRender()}});

const KID_CAT=[['🍎','🍌','🍇','🍓','🍒','🍐','🍑','🍋'],['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐸'],['🚗','🚕','🚌','🚓','🚑','🚒','🚜','🚲'],['🌸','🌻','🌷','🌹','🌼','🌺','🍀','🌵']];
const KID_ITEMS=['🍎','⭐','🐟','🎈','🍓','🐞','🌸','🍪','⚽','🐥','🍄','🦋'];
const KID={n:0,total:10,ok:0,res:[],q:null,busy:false};
const rep=(e,k)=>`<span class="kidgrp">${e.repeat(k)}</span>`;
function kidOpts(a,lo,hi,k){const s=new Set([a]);let g=0;while(s.size<k&&g++<200){const v=rnd(Math.max(lo,a-3),Math.min(hi,a+3));s.add(v)}while(s.size<k)s.add(rnd(lo,hi));return [...s].sort((x,y)=>x-y)}
function kidGen(){
 const type=pick(['count','count','more','next','odd','sum','take','miss','big']),e=pick(KID_ITEMS);
 if(type==='count'){const a=rnd(1,10);return {q:t('kHowMany',{e}),body:rep(e,a),opts:kidOpts(a,1,10,4).map(v=>({h:v,ok:v===a}))}}
 if(type==='more'){let a=rnd(1,8),b;do{b=rnd(1,8)}while(b===a);const less=Math.random()<.35,e2=pick(KID_ITEMS.filter(x=>x!==e));
  return {q:t(less?'kLess':'kMore'),body:'',grp:true,opts:[{h:e.repeat(a),ok:less?a<b:a>b},{h:e2.repeat(b),ok:less?b<a:b>a}]}}
 if(type==='next'){const sets=[['🔴','🔵'],['🟡','🟢','🔴'],['⭐','🌙'],['🍎','🍎','🍌'],['🐱','🐶','🐶'],['🟥','🟦','🟩']],pat=pick(sets),len=rnd(5,7);
  const seq=[];for(let i=0;i<len;i++)seq.push(pat[i%pat.length]);const ans=pat[len%pat.length];
  const pool=[...new Set([...pat,'🟣','🟠','⚪','🍇','🐸'])].filter(x=>x!==ans).sort(()=>Math.random()-.5).slice(0,2);
  return {q:t('kNext'),body:seq.join(' ')+' ❓',emo:true,opts:[ans,...pool].sort(()=>Math.random()-.5).map(x=>({h:x,ok:x===ans}))}}
 if(type==='odd'){const ci=rnd(0,KID_CAT.length-1),A=KID_CAT[ci].slice().sort(()=>Math.random()-.5).slice(0,3),B=pick(KID_CAT.filter((_,i)=>i!==ci)),o=pick(B);
  return {q:t('kOdd'),body:'',emo:true,opts:[...A,o].sort(()=>Math.random()-.5).map(x=>({h:x,ok:x===o}))}}
 if(type==='sum'){const a=rnd(1,5),b=rnd(1,5),s=a+b;return {q:t('kSum'),body:`${rep(e,a)} ➕ ${rep(e,b)}`,opts:kidOpts(s,1,10,4).map(v=>({h:v,ok:v===s}))}}
 if(type==='take'){const a=rnd(3,9),b=rnd(1,a-1),s=a-b;return {q:t('kTake'),body:`${rep(e,a)} ➖ ${rep(e,b)}`,opts:kidOpts(s,0,9,4).map(v=>({h:v,ok:v===s}))}}
 if(type==='miss'){const st=rnd(1,6),k=rnd(1,3),seq=[0,1,2,3,4].map(i=>st+i),ans=seq[k];seq[k]='❓';
  return {q:t('kMiss'),body:seq.join(' '),opts:kidOpts(ans,1,10,4).map(v=>({h:v,ok:v===ans}))}}
 let a=rnd(1,10),b;do{b=rnd(1,10)}while(b===a);return {q:t('kBig'),body:'',opts:[a,b].map(v=>({h:v,ok:v===Math.max(a,b)}))}}

/* ============ НАЧАЛЬНЫЕ СОСТОЯНИЯ ============ */
const shufA=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function chkInit(){let b='';for(let r=0;r<8;r++)for(let c=0;c<8;c++)b+=(r+c)%2===1?(r<3?'b':r>4?'w':'.'):'.';return b}
function uglInit(){let b='';for(let r=0;r<8;r++)for(let c=0;c<8;c++)b+=(r>4&&c<3)?'a':(r<3&&c>4)?'b':'.';return b}
function mpInitState(r,prevR){const P=shufA(active(r)),n=(prevR||0)+1;
 if(r.game==='race')return {r:n,seed:rnd(1,1e9),sc:{}};
 if(r.game==='mem'){const s=shufA(MEM_SYM).slice(0,8);return {r:n,cards:shufA([...s,...s]),got:Array(16).fill(''),open:[],order:P,turn:P[0],sc:{},ot:0,win:''}}
 if(r.game==='ttt')return {r:n,b:'.........',x:P[0],o:P[1],turn:P[0],win:''};
 if(r.game==='chk')return {r:n,b:chkInit(),w:P[0],k:P[1],turn:P[0],chain:-1,win:'',n:0};
 return {r:n,b:uglInit(),a:P[0],z:P[1],turn:P[0],win:'',n:0}}

/* ============ ГОНКА ============ */
function mulb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t0=Math.imul(a^a>>>15,1|a);t0=t0+Math.imul(t0^t0>>>7,61|t0)^t0;return((t0^t0>>>14)>>>0)/4294967296}}
function raceQs(seed){const R=mulb(seed),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),Q=[];
 for(let i=0;i<10;i++){const k=ri(0,2);let q,a;if(k===0){const x=ri(2,15),y=ri(1,20-x);q=`${x} + ${y}`;a=x+y}else if(k===1){const x=ri(5,20),y=ri(1,x-1);q=`${x} − ${y}`;a=x-y}else{const x=ri(2,5),y=ri(2,5);q=`${x} × ${y}`;a=x*y}
  const o=new Set([a]);while(o.size<4){const v=a+ri(-4,4);if(v>=0)o.add(v)}Q.push({q,a,o:[...o].sort(()=>R()-.5)})}return Q}
function mpRaceAnswer(i){const r=RM.room;if(!r||r.status!=='play')return;const s=r.st,me=SESSION;
 if(!RM.race||RM.race.r!==s.r)RM.race={r:s.r,qs:raceQs(s.seed),n:0,c:0,t0:Date.now(),lock:false};const R=RM.race;if(R.lock||R.n>=10)return;
 const q=R.qs[R.n],ok=q.o[i]===q.a;R.lock=true;if(ok){R.c++;sndCorrect(R.c)}else sndWrong();
 const bs=[...document.querySelectorAll('.mpq ~ .kgrid .btn')];if(bs[i])bs[i].classList.add(ok?'right':'bad');
 setTimeout(()=>{R.n++;R.lock=false;const done=R.n>=10;rref(RM.id).update({['st.sc.'+me]:{c:R.c,n:R.n,ms:Date.now()-R.t0,d:done},t:Date.now()}).catch(()=>{});renderMp()},ok?250:700)}

/* ============ ШАШКИ ============ */
const own=(p,col)=>p!=='.'&&p.toLowerCase()===col;
function chkCaps(b,i){const p=b[i],col=p.toLowerCase(),king=p!==col,r=Math.floor(i/8),c=i%8,out=[];
 for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){
  if(!king){const r1=r+dr,c1=c+dc,r2=r+2*dr,c2=c+2*dc;if(r2<0||r2>7||c2<0||c2>7)continue;const m=b[r1*8+c1];if(m!=='.'&&!own(m,col)&&b[r2*8+c2]==='.')out.push({f:i,t:r2*8+c2,cap:r1*8+c1});continue}
  let rr=r+dr,cc=c+dc;while(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]==='.'){rr+=dr;cc+=dc}
  if(rr<0||rr>7||cc<0||cc>7)continue;const m=b[rr*8+cc];if(own(m,col))continue;const cap=rr*8+cc;rr+=dr;cc+=dc;
  while(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]==='.'){out.push({f:i,t:rr*8+cc,cap});rr+=dr;cc+=dc}}
 return out}
function chkSteps(b,i){const p=b[i],col=p.toLowerCase(),king=p!==col,r=Math.floor(i/8),c=i%8,out=[],fw=col==='w'?-1:1;
 for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){if(!king&&dr!==fw)continue;let rr=r+dr,cc=c+dc;
  while(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]==='.'){out.push({f:i,t:rr*8+cc,cap:-1});if(!king)break;rr+=dr;cc+=dc}}return out}
function chkMoves(b,col,chain){if(chain>=0)return chkCaps(b,chain);let caps=[],steps=[];
 for(let i=0;i<64;i++)if(own(b[i],col)){caps=caps.concat(chkCaps(b,i));if(!caps.length)steps=steps.concat(chkSteps(b,i))}return caps.length?caps:steps}
function chkApply(s,mv,me){const col=s.w===me?'w':'b',opp=col==='w'?'b':'w';let b=s.b.split('');let p=b[mv.f];b[mv.f]='.';if(mv.cap>=0)b[mv.cap]='.';
 const row=Math.floor(mv.t/8);if(p===col&&((col==='w'&&row===0)||(col==='b'&&row===7)))p=col.toUpperCase();b[mv.t]=p;b=b.join('');
 let chain=-1,turn=me;if(mv.cap>=0&&chkCaps(b,mv.t).length)chain=mv.t;else turn=me===s.w?s.k:s.w;
 let win='';if(chain<0&&!chkMoves(b,opp,-1).length)win=me;return {'st.b':b,'st.chain':chain,'st.turn':turn,'st.win':win,'st.n':(s.n||0)+1}}

/* ============ УГОЛКИ ============ */
function uglTargets(b,i){const r0=Math.floor(i/8),c0=i%8,out=new Set(),D=[[-1,0],[1,0],[0,-1],[0,1]],ok=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
 for(const [dr,dc] of D){const r=r0+dr,c=c0+dc;if(ok(r,c)&&b[r*8+c]==='.')out.add(r*8+c)}
 const seen=new Set([i]),q=[i];while(q.length){const x=q.shift(),r=Math.floor(x/8),c=x%8;
  for(const [dr,dc] of D){const r1=r+dr,c1=c+dc,r2=r+2*dr,c2=c+2*dc;if(!ok(r2,c2))continue;if(b[r1*8+c1]!=='.'&&b[r2*8+c2]==='.'&&!seen.has(r2*8+c2)){seen.add(r2*8+c2);out.add(r2*8+c2);q.push(r2*8+c2)}}}
 return [...out]}
const uglHome=(i,who)=>{const r=Math.floor(i/8),c=i%8;return who==='a'?(r<3&&c>4):(r>4&&c<3)};
function uglApply(s,f,to,me){const m=s.a===me?'a':'b';let b=s.b.split('');b[to]=m;b[f]='.';b=b.join('');
 let win='';const mine=[...b].map((x,i)=>x===m?i:-1).filter(i=>i>=0);if(mine.every(i=>uglHome(i,m)))win=me;
 return {'st.b':b,'st.turn':me===s.a?s.z:s.a,'st.win':win,'st.n':(s.n||0)+1}}

function mpBoardTap(i){const r=RM.room;if(!r||r.status!=='play')return;const s=r.st,me=SESSION;if(s.win||s.turn!==me){sndWrong();return}
 if(r.game==='chk'){const col=s.w===me?'w':'b',mv=chkMoves(s.b,col,s.chain);
  if(RM.sel>=0){const m=mv.find(x=>x.f===RM.sel&&x.t===i);if(m){RM.sel=-1;sndTick();mpTx(rr=>{const ss=rr.st;if(ss.turn!==me||ss.b!==s.b)return null;return chkApply(ss,m,me)});return}}
  if(mv.some(x=>x.f===i)){RM.sel=i;sndTick()}else{RM.sel=-1;if(own(s.b[i],col))sndWrong()}renderMp();return}
 const m=s.a===me?'a':'b';
 if(RM.sel>=0&&s.b[i]==='.'&&uglTargets(s.b,RM.sel).includes(i)){const f=RM.sel;RM.sel=-1;sndTick();mpTx(rr=>{const ss=rr.st;if(ss.turn!==me||ss.b!==s.b)return null;return uglApply(ss,f,i,me)});return}
 RM.sel=s.b[i]===m?i:-1;if(RM.sel>=0)sndTick();renderMp()}

/* ============ ЭКРАН ============ */
function mpPaid(r){const s=r.st,key=RM.id+':'+s.r;if(s.win===SESSION&&!RM.paid.has(key)){RM.paid.add(key);const p=cur();if(p){p.dopa+=5;save(p);announce(checkUnlocks(p))}sndFanfare();fireworks(4);rain(50)}}
function mpEnd(r,winTxt){return `<div class="status" style="font-size:16px;margin:10px 0">${winTxt}</div><div class="row"><button class="btn" data-act="mpLeave">${t('mpLeave')}</button><button class="btn pri big" data-act="mpAgain">${t('mpAgain')}</button></div>`}
function winText(s){return s.win==='draw'?t('mpDraw'):s.win===SESSION?t('mpYouWin'):esc(t('mpWin',{n:pnm(s.win)}))}
function turnLine(s){return s.win?'':`<div class="mpturn">${s.turn===SESSION?t('mpTurnMe'):esc(t('mpTurnOf',{n:pnm(s.turn)}))}</div>`}
function board8(s,cellFn,flip){let h='';for(let k=0;k<64;k++){const i=flip?63-k:k;h+=cellFn(i)}return `<div class="bd8" style="width:min(400px,92vw)">${h}</div>`}
function renderMp(){SCREEN='mp';const p=cur();if(!p){SCREEN='login';return render()}
 const head=`<header class="top blk"><button class="icon" data-act="${RM.id?'mpLeave':'back'}" aria-label="←">⬅</button><h2 style="margin:0">${t('mpBtn')}</h2><div class="sp"></div><span class="dopa">⚡ <b id="dopaVal">${p.dopa}</b></span></header>`;
 if(!socialOn()){app.innerHTML=head+`<section class="panel blk"><p style="font-weight:800">${t('onlineOnly')}</p></section>`;return}
 const r=RM.room;
 if(!RM.id||!r){const inv=Object.entries(RM.inv);
  app.innerHTML=head+(inv.length?`<section class="panel blk"><h2>${t('mpInvites')}</h2>${inv.map(([id,x])=>frRow(x.host,`<b>${MPG[x.game].i} ${esc(t('g_'+x.game))}</b><button class="btn sm" data-act="mpDecline" data-arg="${id}">✖</button><button class="btn sm pri" data-act="mpJoin" data-arg="${id}">${t('mpJoin')}</button>`)).join('')}</section>`:'')+
  `<section class="panel blk" style="text-align:center"><h2>${t('mpTitle')}</h2><p style="font-weight:800">${t('mpChoose')}</p><div class="mpgrid">${Object.keys(MPG).map(g=>`<button class="btn" data-act="mpNew" data-arg="${g}"><span>${MPG[g].i}</span>${t('g_'+g)}<small>${t('h_'+g)} · 2–${MPG[g].max}</small></button>`).join('')}</div></section>`;return}
 const g=r.game,act=active(r),title=`${MPG[g].i} ${esc(t('g_'+g))}`;
 if(r.status==='lobby'){const fr=Object.values(SOC.friends).filter(f=>f.status==='ok').map(otherOf).filter(x=>DB.players[x]&&!r.players.includes(x));
  app.innerHTML=head+`<section class="panel blk" style="text-align:center"><h2>${esc(t('mpLobby',{g:t('g_'+g)}))}</h2><p style="font-weight:800">${t('h_'+g)}</p>
  <h3>${t('mpPlayers',{n:act.length,m:MPG[g].max})}</h3>${act.map(x=>frRow(x,x===r.host?'👑':'')).join('')}
  ${r.host===SESSION?`<div class="row"><button class="btn" data-act="mpLeave">${t('mpLeave')}</button><button class="btn pri big" data-act="mpGo" ${act.length<2?'disabled':''}>${t('mpStart')}</button></div>${act.length<2?`<p class="muted" style="font-weight:800">${t('mpNeed2')}</p>`:''}`:`<p style="font-weight:800">${t('mpWaitHost')}</p><div class="row"><button class="btn" data-act="mpLeave">${t('mpLeave')}</button></div>`}</section>
  ${act.length<MPG[g].max?`<section class="panel blk"><h2>${t('mpInviteF')}</h2>${fr.length?fr.map(x=>frRow(x,(r.invited||[]).includes(x)?`<span style="font-weight:800">${t('mpWaitInv')}</span>`:`<button class="btn sm pri" data-act="mpInvite" data-arg="${esc(x)}">${t('mpInv')}</button>`)).join(''):`<p style="font-weight:800">${t('mpNoFriends')}</p>`}</section>`:''}`+mpChat(r);mpChatScroll();return}
 const s=r.st||{};let body='';
 if(g==='race'){if(!RM.race||RM.race.r!==s.r){const my=(s.sc||{})[SESSION];RM.race={r:s.r,qs:raceQs(s.seed),n:my?my.n:0,c:my?my.c:0,t0:Date.now()-(my?my.ms:0),lock:false}}
  const R=RM.race,sc=s.sc||{},allDone=act.every(x=>sc[x]&&sc[x].d);
  const bars=act.map(x=>{const v=sc[x]||{n:0,c:0};return `<div class="mpbar ${x===SESSION?'me':''}">${pAva(x)}<span style="min-width:70px">${esc(pnm(x))}</span><div class="tr"><i style="width:${v.n*10}%"></i></div><span>✅${v.c}</span></div>`}).join('');
  if(allDone){const rank=act.slice().sort((a,b)=>(sc[b].c-sc[a].c)||(sc[a].ms-sc[b].ms));const top=rank[0];
   if(!s.win&&top){s.win=top}mpPaid(Object.assign({},r,{st:Object.assign({},s,{win:top})}));
   body=`<h3>${t('mpResults')}</h3>${rank.map((x,k)=>`<div class="mpbar ${x===SESSION?'me':''}"><b>${['🥇','🥈','🥉','4'][k]}</b>${pAva(x)}<span style="flex:1">${esc(pnm(x))}</span><span>✅${sc[x].c}/10 · ${(sc[x].ms/1000).toFixed(1)}s</span></div>`).join('')}${mpEnd(r,winText({win:top}))}`}
  else if(R.n>=10)body=`<p style="font-weight:800">${t('mpRaceWait')}</p>${bars}<div class="row"><button class="btn" data-act="mpLeave">${t('mpLeave')}</button></div>`;
  else{const q=R.qs[R.n];body=`<div class="kprog">${Array.from({length:10},(_,i)=>`<i class="${i<R.n?'ok':i===R.n?'now':''}"></i>`).join('')}</div><div class="mpq">${q.q} = ?</div><div class="kgrid">${q.o.map((v,i)=>`<button class="btn" data-act="mpRace" data-arg="${i}">${v}</button>`).join('')}</div>${bars}`}}
 else if(g==='ttt'){if(s.win&&s.win!=='draw')mpPaid(r);const line=tttWin(s.b)||[];
  body=`<div class="mpsc"><span class="${s.turn===s.x&&!s.win?'now':''}">❌ ${esc(pnm(s.x))}</span><span class="${s.turn===s.o&&!s.win?'now':''}">⭕ ${esc(pnm(s.o))}</span></div>${turnLine(s)}
  <div class="ttt">${[...s.b].map((c,i)=>`<button class="btn ${line.includes(i)?'wl':''}" data-act="mpTtt" data-arg="${i}">${c==='x'?'❌':c==='o'?'⭕':''}</button>`).join('')}</div>${s.win?mpEnd(r,winText(s)):''}`}
 else if(g==='mem'){if(s.win&&s.win!=='draw')mpPaid(r);
  body=`<div class="mpsc">${act.map(x=>`<span class="${x===s.turn&&!s.win?'now':''}">${pAva(x)} ${esc(pnm(x))}: ${(s.sc||{})[x]||0}</span>`).join('')}</div>${turnLine(s)}
  <div class="mpmem">${s.cards.map((e,i)=>{const up=s.got[i]||s.open.includes(i);return `<button class="btn ${up?'':'hid'} ${s.got[i]?'got':''}" data-act="mpMem" data-arg="${i}">${e}</button>`}).join('')}</div>${s.win?mpEnd(r,winText(s)):''}`;
  if(s.open.length===2){clearTimeout(RM.memT);RM.memT=setTimeout(()=>mpMemClose(s.r),Math.max(300,2600-(Date.now()-(s.ot||0))))}}
 else if(g==='chk'){if(s.win)mpPaid(r);const col=s.w===SESSION?'w':'b',flip=col==='b',mv=s.turn===SESSION&&!s.win?chkMoves(s.b,col,s.chain):[],tg=mv.filter(x=>x.f===RM.sel).map(x=>x.t),from=new Set(mv.map(x=>x.f));
  const pc={w:'⚪',b:'⚫',W:'🤍',B:'🖤'};
  body=`<div class="mpsc"><span class="${s.turn===s.w&&!s.win?'now':''}">⚪ ${esc(pnm(s.w))}</span><span class="${s.turn===s.k&&!s.win?'now':''}">⚫ ${esc(pnm(s.k))}</span></div>${turnLine(s)}${s.chain>=0&&s.turn===SESSION?`<div class="status">${t('mpChain')}</div>`:''}
  ${board8(s,i=>{const r0=Math.floor(i/8),c0=i%8,dark=(r0+c0)%2===1,ch=s.b[i];return `<button class="sq ${dark?'dk':'lt'} ${i===RM.sel?'sel':''} ${tg.includes(i)?'tg':''} ${from.has(i)&&RM.sel<0?'can':''}" data-act="mpCell" data-arg="${i}">${ch!=='.'?`<i class="pc ${ch.toLowerCase()} ${ch!==ch.toLowerCase()?'king':''}"></i>`:''}</button>`},flip)}
  <p class="on-sky" style="font-weight:800;font-size:12px">${t('r_chk')}</p>${s.win?mpEnd(r,winText(s)):''}`}
 else{if(s.win)mpPaid(r);const m=s.a===SESSION?'a':'b',flip=m==='b',tg=RM.sel>=0&&s.turn===SESSION?uglTargets(s.b,RM.sel):[];
  body=`<div class="mpsc"><span class="${s.turn===s.a&&!s.win?'now':''}">🟡 ${esc(pnm(s.a))}</span><span class="${s.turn===s.z&&!s.win?'now':''}">🔵 ${esc(pnm(s.z))}</span></div>${turnLine(s)}
  ${board8(s,i=>{const ch=s.b[i],home=uglHome(i,'a')||uglHome(i,'b');return `<button class="sq ${home?'hm':'lt'} ${i===RM.sel?'sel':''} ${tg.includes(i)?'tg':''}" data-act="mpCell" data-arg="${i}">${ch!=='.'?`<i class="pc ${ch==='a'?'ya':'bz'}"></i>`:''}</button>`},flip)}
  <p class="on-sky" style="font-weight:800;font-size:12px">${t('h_ugl')}. ${t('r_ugl')}</p>${s.win?mpEnd(r,winText(s)):''}`}
 app.innerHTML=head+`<section class="panel blk" style="text-align:center"><h2>${title}</h2>${body}</section>`+mpChat(r);mpChatScroll()}
function mpChat(r){const ch=(r.chat||[]).slice(-8);
 return `<section class="panel blk" style="text-align:center"><div class="chat slotbox" style="height:auto;max-height:24vh;min-height:60px" id="mpChat">${ch.length?ch.map(x=>`<div class="msg ${x.f===SESSION?'me':''}"><b>${esc(pnm(x.f))}:</b> ${esc(msgText(x.x))}</div>`).join(''):`<p style="color:#fff;font-weight:800">${t('noMsgs')}</p>`}</div>
 <div class="row"><button class="btn sm ${RM.chatOpen?'':'pri'}" data-act="mpChatT">💬 ${RM.chatOpen?'▲':'▼'}</button></div>
 ${RM.chatOpen?`<div class="phr">${Object.keys(PHRASES).map(k=>`<button class="btn sm" data-act="mpSay" data-arg="p:${k}">${esc(tx(PHRASES[k]))}</button>`).join('')}</div><div class="phr emo">${EMO.map(e=>`<button class="btn sm" data-act="mpSay" data-arg="e:${e}">${e}</button>`).join('')}</div>`:''}</section>`}
function mpChatScroll(){const c=document.getElementById('mpChat');if(c)c.scrollTop=c.scrollHeight}
</script>
</body></html>
